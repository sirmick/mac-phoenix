[[node]]
  id = "volume-fast"
  title = "Tab start: Executor's volume restored in one compressed request (and saved in batches)"
  emoji = "⚡"
  template = "package"
  parent = "p1"
  body = "Owner 2026-11-03: Executor's disk dominates loading. Today sync.js volumeDown GETs objects/SHA one file at a time, sequentially, uncompressed: the saved boot-8.6 volume is 1191 files / 70 MB, boot-7.6.1 1010 / 45 MB = ~1000 round trips. Fix: a bundle endpoint (POST volumes/KEY/bundle or GET with the manifest's shas) streaming every object in one response, gzip/zstd-compressed (Content-Encoding or a framed stream: sha, length, bytes), unpacked in the Worker as it streams (DecompressionStream), so writing overlaps downloading; parallel GETs as the fallback. Save side the same: objects/missing then one batched PUT. Measure before/after (time to Finder) and report; tests in tools/standalone and the tab cells."
  state = "done"
  revision = 2

