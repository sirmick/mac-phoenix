  body = "Owner 2026-11-08 chose route B (docs/executor/QuickTime.md): Executor registers Apple's QuickTime components from the QuickTime™ / PowerPlug / Musical Instruments files on the user's System disk (the INIT never runs) and provides its own C++ ICM, Movie Toolbox subset (~45 calls) and movie controller (~15). Codecs are never shipped by us; Executor's own System has none (later maybe our own raw/rle/Cinepak decoders). Steps: qt-b1 groundwork, qt-b2 ICM, qt-b3 Movie Toolbox, qt-b4 controller + PowerPC exports, qt-b5 sound; Apple's INIT (route A) only if an app needs what B lacks. Oracle: QTTest (tests/guest/qt) vs the Quadra/G3 references."
