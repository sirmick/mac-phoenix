[[node]]
  id = "standalone-auth"
  title = "Standalone auth: the first browser served claims the backend (token cookie); others refused"
  emoji = "🔑"
  parent = "p1"
  body = "Owner decisions 2026-11-02 (final): on the first serve of index.html with no claim, the server generates a token and sets it as an HttpOnly SameSite=Strict cookie (Secure under TLS). The claim is in memory only: every backend start begins unclaimed, so restarting the backend means reloading the frontend; no persistence, no --reset-claim. The cookie authenticates the UI: all API, disk, relay and log routes need it, and a reload in the same browser keeps working. Other browsers get an 'in use by another browser' page and can't read or write. After a backend restart, the tab sees 401/403 and tells the user to reload. No password, no loopback exception, no pre-shared key, no paired list. The earlier session/take-control lock folds into this or goes. Tests: first GET claims, a second browser refused, reload OK, restart frees."
  state = "done"
  revision = 10

