# MacPhoenix: the Movie Toolbox, _QuickTime $AAAA (Inside Macintosh:
# QuickTime, "Movie Toolbox"; Universal Interfaces 3.4's Movies.h, whose
# selectors and argument types these are). On a Mac it is QuickTime's INIT;
# Executor implements it in C++ (movies.cpp; docs/executor/QuickTime.md,
# route B) over Apple's codecs through its own ICM. The movie controller
# ('play' component, NewMovieController) is Executor's own (mc.cpp). PowerPC code
# reaches these through QuickTimeLib, Executor's (library: QuickTimeLib).

- struct:
    name: MovieRecord
    members:
      - name: data
        type: LONGINT[1]
    size: 4

