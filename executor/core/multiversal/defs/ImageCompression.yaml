# MacPhoenix: QuickTime's Image Compression Manager and its fixed-point,
# wide and matrix routines (Inside Macintosh: QuickTime, "Image
# Compression Manager"; Universal Interfaces 3.3.2's ImageCompression.h,
# FixMath.h, whose selectors these are). On a Mac both are QuickTime's
# INIT: the ICM is $AAA3, the math the private trap $ABC2, which QuickTime's
# codecs, media handlers and Movie Toolbox call. Executor implements them
# in C++ (icm.cpp, qtmath.cpp; docs/executor/QuickTime.md, route B),
# whether or not Apple's QuickTime is on the disk; where the documents
# leave rounding and edge cases open, the math answers as a 7.6.1 Quadra
# with QuickTime 2.5 does (tests/guest/qtmath). PowerPC code reaches them
# through QuickTimeLib, which Executor doesn't export yet.

- dispatcher:
    name: QTMathDispatch
    trap: 0xABC2
    selector-location: D0W
    comment: |
      The selector in D0 (TWOWORDINLINE(0x70nn, 0xABC2): moveq #nn, D0),
      Pascal arguments on the stack.

# ####

- struct:
    name: FixedPoint
    members:
      - name: x
        type: Fixed
      - name: y
        type: Fixed
    size: 8

# ####

- struct:
    name: FixedRect
    members:
      - name: left
        type: Fixed
      - name: top
        type: Fixed
      - name: right
        type: Fixed
      - name: bottom
        type: Fixed
    size: 16

# ####

# A point (x, y) maps to (x*m[0][0] + y*m[1][0] + m[2][0],
# x*m[0][1] + y*m[1][1] + m[2][1]) / (x*m[0][2] + y*m[1][2] + m[2][2]);
# the first two columns are Fixed, the third Fract.
- struct:
    name: MatrixRecord
    members:
      - name: matrix
        type: Fixed[3][3]
    size: 36

