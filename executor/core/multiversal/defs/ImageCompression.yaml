# ####

# MacPhoenix: the Image Compression Manager (Inside Macintosh: QuickTime,
# "Image Compression Manager"; QuickTime Components, "Image Compressor
# Components"), trap $AAA3: Executor's own (icm.cpp), over Apple's codec
# components. A selector in D0's low word (TWOWORDINLINE(0x70nn, 0xAAA3),
# or FOURWORDINLINE(0x203C, size, sel, 0xAAA3) with the parameters' size
# in the high word); Pascal arguments on the stack. Codecs call it too,
# through its trap-table slot ($188C) as well as the trap.
- dispatcher:
    name: CodecDispatch
    trap: 0xAAA3
    selector-location: D0W

# ####

- typedef:
    name: CodecType
    type: OSType

# ####

- typedef:
    name: CodecQ
    type: LONGINT

# ####

- typedef:
