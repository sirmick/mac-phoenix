# ####

# MacPhoenix: the Image Compression Manager (Inside Macintosh: QuickTime,
# "Image Compression Manager"; QuickTime Components, "Image Compressor
# Components"), trap $AAA3: Executor's own (icm.cpp), over Apple's codec
# components. A selector in D0's low word (TWOWORDINLINE(0x70nn, 0xAAA3),
# or FOURWORDINLINE(0x203C, size, sel, 0xAAA3) with the parameters' size
# in the high word); Pascal arguments on the stack. Codecs call it too,
# through its trap-table slot ($188C) as well as the trap.
- dispatcher:
    name: CodecDispatch
    trap: 0xAAA3
    selector-location: D0W

# ####

- typedef:
    name: CodecType
    type: OSType

# ####

- typedef:
    name: CodecQ
    type: LONGINT

# ####

- typedef:
    name: ImageSequence
    type: LONGINT

# ####

- struct:
    name: ImageDescription
    members:
      - name: idSize
        type: LONGINT
      - name: cType
        type: CodecType
      - name: resvd1
        type: LONGINT
      - name: resvd2
        type: INTEGER
      - name: dataRefIndex
        type: INTEGER
      - name: version
        type: INTEGER
      - name: revisionLevel
        type: INTEGER
      - name: vendor
        type: LONGINT
      - name: temporalQuality
        type: CodecQ
      - name: spatialQuality
        type: CodecQ
      - name: width
        type: INTEGER
      - name: height
        type: INTEGER
      - name: hRes
        type: Fixed
      - name: vRes
        type: Fixed
      - name: dataSize
        type: LONGINT
      - name: frameCount
        type: INTEGER
      - name: name
        type: Str31
      - name: depth
        type: INTEGER
      - name: clutID
        type: INTEGER
    size: 86

# ####

- typedef:
    name: ImageDescriptionPtr
    type: ImageDescription*

# ####

- typedef:
    name: ImageDescriptionHandle
    type: ImageDescription**

# ####

- funptr:
    name: ICMCompletionUPP
    args:
      - name: result
        type: OSErr
      - name: flags
        type: INTEGER
      - name: refcon
        type: LONGINT

# ####

- struct:
    name: ICMCompletionProcRecord
    members:
      - name: completionProc
        type: ICMCompletionUPP
      - name: completionRefCon
        type: LONGINT
    size: 8

# ####

- typedef:
    name: ICMCompletionProcRecordPtr
    type: ICMCompletionProcRecord*

# ####

- enum:
    values:
      - name: codecCompletionSource
        value: 1
      - name: codecCompletionDest
        value: 2

# ####

- function:
    name: CodecManagerVersion
    return: OSErr
    args:
      - name: version
        type: LONGINT*
    trap: 0xAAA3
    dispatcher: CodecDispatch
    selector: 0x0000
    executor: C_
    export: false

# ####

# The color table of an image description: its 'clut' resource (clutID
# above 0), the table stored after it (0), or none (-1: nil).
- function:
    name: GetImageDescriptionCTable
    return: OSErr
    args:
      - name: desc
        type: ImageDescriptionHandle
      - name: ctable
        type: CTabHandle*
    trap: 0xAAA3
    dispatcher: CodecDispatch
    selector: 0x001E
    executor: C_
    export: false

# ####

# A codec's word that it is done with the source or destination of a
# decompression (flag: codecCompletionSource, codecCompletionDest): the
# caller's completion routine is called, if it gave one.
- function:
    name: ICMDecompressComplete
    args:
      - name: seqID
        type: ImageSequence
      - name: err
        type: OSErr
      - name: flag
        type: INTEGER
      - name: completionRtn
        type: ICMCompletionProcRecordPtr
    trap: 0xAAA3
    dispatcher: CodecDispatch
    selector: 0x0063
    executor: C_
    export: false
