# The Cursor Device Manager (CursorDevices.h): pointing devices as
# records the Mouse control panel (9.0.4's INIT sets the double-click time
# and acceleration through it) and games (Marathon 2's CrsrDevMoveTo,
# CrsrDevNextDevice) use. One device, the mouse (romlib/cursordev.cpp).

- struct:
    name: CursorData

# ####

- struct:
    name: CursorDevice
    members:
      - name: nextCursorDevice
        type: CursorDevice*
      - name: whichCursor
        type: CursorData*
      - name: refCon
        type: int32_t
      - name: unused
        type: int32_t
      - name: devID
        type: OSType
      - name: resolution
        type: Fixed
      - name: devClass
        type: UInt8
      - name: cntButtons
        type: UInt8
      - name: filler1
        type: UInt8
      - name: buttons
        type: UInt8
      - name: buttonOp
        type: UInt8[8]
      - name: buttonTicks
        type: uint32_t[8]
      - name: buttonData
        type: int32_t[8]
      - name: doubleClickTime
        type: uint32_t
      - name: acceleration
        type: Fixed
      - name: privateFields
        type: short[15]
    size: 138

# ####

- typedef:
    name: CursorDevicePtr
    type: CursorDevice*

# ####

- typedef:
    name: ButtonOpcode
    type: short

# ####

- enum:
    values:
      - name: kButtonNoOp
        value: 0
      - name: kButtonSingleClick
        value: 1
      - name: kButtonDoubleClick
        value: 2
      - name: kButtonClickLock
        value: 3
      - name: kButtonCustom
        value: 6

# ####

- enum:
    values:
      - name: kDeviceClassAbsolute
        value: 0
      - name: kDeviceClassMouse
        value: 1
      - name: kDeviceClassTrackball
        value: 2
      - name: kDeviceClassTrackPad
        value: 3
      - name: kDeviceClass3D
        value: 6

# ####

- dispatcher:
    name: CursorDeviceDispatch
    trap: 0xAADB
    selector-location: D0W

# ####

- function:
