# MacPhoenix: the Collection Manager (Inside Macintosh: QuickDraw GX
# Environment and Utilities, "Collection Manager"), from Universal
# Interfaces' Collections.h and Collections.r. A collection is a set of items
# keyed by tag and ID, each with data and attribute bits, that can be
# flattened to a stream ('flac'). On a Mac it is the System's code behind
# _CollectionMgr ($ABF6, 8.x: the native Collections fragment), PowerPC
# code reaching it through CollectionsLib's glue; Executor implements it in
# C++ (collections.cpp) and exports CollectionsLib's routines.

- dispatcher:
    name: CollectionMgr
    trap: 0xABF6
    selector-location: D0<0xFF>
    comment: |
      The selector in D0 (TWOWORDINLINE(0x70nn, 0xABF6): moveq #nn, D0),
      Pascal arguments on the stack.

# ####

- struct:
    name: OpaqueCollection

- typedef:
    name: Collection
    type: OpaqueCollection*

- typedef:
    name: CollectionTag
    type: OSType

# ####

- enum:
    values:
      - name: kCollectionDontWantTag
        value: 0
      - name: kCollectionDontWantId
        value: 0
      - name: kCollectionDontWantSize
        value: 0
      - name: kCollectionDontWantAttributes
        value: 0
      - name: kCollectionDontWantIndex
        value: 0
      - name: kCollectionDontWantData
        value: 0

- enum:
    values:
      - name: kCollectionNoAttributes
        value: 0x00000000
      - name: kCollectionAllAttributes
        value: -1
      - name: kCollectionUserAttributes
        value: 0x0000FFFF
      - name: kCollectionDefaultAttributes
        value: 0x40000000

- enum:
    values:
      - name: kCollectionPersistenceBit
        value: 30
      - name: kCollectionLockBit
        value: 31

- enum:
    values:
      - name: kCollectionPersistenceMask
        value: 0x40000000
      - name: kCollectionLockMask
        value: -2147483648

- enum:
    values:
      - name: collectionItemLockedErr
        value: -5750
      - name: collectionItemNotFoundErr
        value: -5751
      - name: collectionIndexRangeErr
        value: -5752
      - name: collectionVersionErr
        value: -5753

