name: build

# PR + main: build all four (distro × arch) cells, smoke-test the .deb,
#            upload as workflow artifacts.
# Tag v*:    same builds, plus the source tarball, posted to the GitHub
#            Release as downloadable assets.
# Manual:    workflow_dispatch from the Actions tab.
#
# Build-deps come from `apt-get build-dep .` reading debian/control —
# same path packaging/Dockerfile.deb takes, so this CI and a local
# `dpkg-buildpackage` produce identical packages.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04-amd64
            distro: ubuntu24.04
            runner: ubuntu-24.04
            container: ''
          - label: ubuntu-24.04-arm64
            distro: ubuntu24.04
            runner: ubuntu-24.04-arm
            container: ''
          - label: debian-12-amd64
            distro: debian12
            runner: ubuntu-24.04
            container: debian:12
          - label: debian-12-arm64
            distro: debian12
            runner: ubuntu-24.04-arm
            container: debian:12
    steps:
      - name: Bootstrap container (Debian 12 only)
        if: matrix.container != ''
        run: |
          # The debian:12 image is bare — install git + sudo so the
          # rest of the workflow looks the same as on ubuntu runners.
          apt-get update
          apt-get install -y --no-install-recommends \
              ca-certificates git sudo
          # Inside a container the workspace dir is owned by the runner
          # user (uid 1001) but git runs as root, tripping git's
          # CVE-2022-24765 "dubious ownership" guard. Mark the workspace
          # safe before checkout. Wildcard is fine here — the container
          # is single-use per job.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential debhelper devscripts dpkg-dev \
              ca-certificates curl xz-utils
          # Reads Build-Depends: from debian/control — single source of
          # truth shared with packaging/Dockerfile.deb.
          sudo apt-get build-dep -y .

      - name: Pick rust toolchain
        run: |
          # Two cases:
          #
          #  1. ubuntu-24.04 runner — apt rustc 1.75 + a rustup wrapper at
          #     ~/.cargo/bin/{cargo,rustc} ahead of /usr/bin. The wrapper
          #     has no default toolchain and can't be coaxed back through
          #     dpkg-buildpackage's child env (we tried `rustup default
          #     stable`, the env loses it). Delete the wrapper so CMake's
          #     find_program(CARGO cargo) hits /usr/bin/cargo.
          #
          #  2. debian:12 container — apt rustc 1.63, too old for our
          #     transitive deps (regex 1.12.3 needs 1.65+). Install rustup
          #     with stable so /root/.cargo/bin/cargo IS the cargo CMake
          #     finds first. Mirrors packaging/Dockerfile.deb's policy.
          set -eux
          APT_RUSTC_MAJOR=$(rustc --version | awk '{print $2}' | cut -d. -f1)
          APT_RUSTC_MINOR=$(rustc --version | awk '{print $2}' | cut -d. -f2)
          if [ "$APT_RUSTC_MAJOR" -gt 1 ] || \
             { [ "$APT_RUSTC_MAJOR" -eq 1 ] && [ "$APT_RUSTC_MINOR" -ge 75 ]; }; then
              echo "apt rust >=1.75 — using it, removing any rustup wrapper"
              rm -rf "$HOME/.cargo/bin"
          else
              echo "apt rust <1.75 — installing rustup stable"
              # GitHub Actions sets HOME=/github/home inside container jobs,
              # but euid root has /root. rustup-init refuses to proceed on
              # that mismatch. Pin both rustup state and CARGO_HOME under
              # /root so installer + every later cargo invocation agree.
              EUID_HOME="$(getent passwd "$(id -u)" | cut -d: -f6)"
              export RUSTUP_HOME="${EUID_HOME}/.rustup"
              export CARGO_HOME="${EUID_HOME}/.cargo"
              HOME="$EUID_HOME" curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                  | HOME="$EUID_HOME" sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
              export PATH="${CARGO_HOME}/bin:$PATH"
              echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
              # Persist the homes so dpkg-buildpackage's child env keeps them.
              echo "RUSTUP_HOME=${RUSTUP_HOME}" >> "$GITHUB_ENV"
              echo "CARGO_HOME=${CARGO_HOME}"   >> "$GITHUB_ENV"
          fi
          hash -r
          which cargo
          cargo --version

      - name: Build vendored source tarball, then build from it
        run: |
          set -eux
          # tools/make-source-tarball.sh produces a self-contained tarball
          # at dist/mac-phoenix_<ver>.tar.xz with vendored cargo crates
          # (net-bridge/vendor/cargo/) + .cargo/config.toml + Cargo.lock
          # downgraded to v3. debian/rules requires CARGO_NET_OFFLINE=true,
          # so dpkg-buildpackage MUST find these in the build tree.
          # Building from the extracted tarball is the same path Dockerfile.deb
          # takes — avoids drift between local and CI builds.
          tools/make-source-tarball.sh
          mkdir -p /tmp/build
          tar -xJf dist/mac-phoenix_*.tar.xz --strip-components=1 -C /tmp/build
          cd /tmp/build
          dpkg-buildpackage -us -uc -b
          # dpkg drops the .deb one dir up from the source root.
          mkdir -p "$GITHUB_WORKSPACE/debs"
          cp /tmp/*.deb "$GITHUB_WORKSPACE/debs/"

      - name: Install + smoke-test
        run: |
          set -eux
          sudo dpkg -i debs/mac-phoenix_*.deb || true
          sudo apt-get install -y -f
          ./packaging/ci/smoke-installed.sh

      - name: Stage artifact with descriptive name
        run: |
          set -eux
          mkdir -p staging
          # Inject the distro tag between version and arch using the
          # Debian "+suffix" convention so all four .debs coexist
          # without colliding. Example:
          #   mac-phoenix_1.0.0-1_amd64.deb
          #     → mac-phoenix_1.0.0-1+${{ matrix.distro }}_amd64.deb
          for f in debs/mac-phoenix_*.deb; do
              base="$(basename "$f" .deb)"
              ver_rev="${base%_*}"   # mac-phoenix_1.0.0-1
              arch="${base##*_}"     # amd64 / arm64
              cp "$f" "staging/${ver_rev}+${{ matrix.distro }}_${arch}.deb"
          done
          ls -la staging/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: staging/*.deb
          retention-days: 90

  unit-tests:
    name: ctest -L unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          # Same single source of truth as the package job — debian/control's
          # Build-Depends covers everything CMake needs.
          sudo apt-get build-dep -y .
      - name: Disable rustup wrapper
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
              rm -rf "$HOME/.cargo/bin"
          fi
          hash -r
      - run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build -j$(nproc)
      - run: ctest --test-dir build -L unit --output-on-failure

  release:
    name: Publish release
    needs: [package, unit-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build source tarball
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              cargo rustc xz-utils
          tools/make-source-tarball.sh
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true
      - name: Collect release assets
        run: |
          set -eux
          mkdir -p release
          cp dist/mac-phoenix_*.tar.xz release/
          cp artifacts/*.deb release/
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
