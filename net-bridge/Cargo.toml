[package]
name = "net-bridge"
version = "0.1.0"
edition = "2021"
description = "Standalone network bridge for Mac emulator - smoltcp TCP/IP + NAT"

[dependencies]
smoltcp = { version = "0.12", features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-raw",
] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
openssl = "0.10"
