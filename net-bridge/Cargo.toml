[package]
name = "net-bridge"
version = "0.1.0"
edition = "2021"
description = "Standalone network bridge for Mac emulator - smoltcp TCP/IP + NAT"
# Pinned at the floor of distro rust on Ubuntu 22.04+/Fedora 40+/Debian 12-bpo
# so packaging builds don't need rustup. Bump only if a dep we actually need
# raises its MSRV — pin smoltcp/env_logger here (not the latest) for the same
# reason.
rust-version = "1.75"

[dependencies]
smoltcp = { version = "0.11", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-raw",
    "std",
] }
log = "0.4"
env_logger = "0.10"
libc = "0.2"
# openssl 0.10.66 (= openssl-sys 0.9.103) is the last release that still
# supports OpenSSL 1.0.x. We need 1.0.2u for SSLv2 + 40-bit export ciphers
# (NN3-international-Mac); newer openssl-sys hard-rejects it at build.
openssl = "=0.10.66"
openssl-sys = "=0.9.103"
