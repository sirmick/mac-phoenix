# What we've learned that multiversal doesn't say (yet).
#
# Layered over src/executor/multiversal/defs by macdecode: an entry here
# adds a name or replaces multiversal's entry at the same address/trap.
# Multiversal itself stays untouched until we decide to fold these in.
#
# status: known (documented or proven) | guess (plausible, unproven)
#         | placeholder (nonzero, meaning unknown)
# replaces: the multiversal name this overrides, as a reminder
# source: where we learned it (Inside Mac page, disassembly, snapshot)

lowmem:
  - address: 0x2B6
    name: ExpandMem
    type: Ptr
    status: known
    replaces: AE_info
    source: Inside Macintosh (System 7 low memory), MEMORY_MAP.md
    comment: >
      Pointer to ExpandMemRec (Gestalt table, Script Manager and other
      post-128K-ROM globals). Executor reuses this slot for AppleEvents
      state under the name AE_info.

  - address: 0xC10
    name: RGBBlack
    type: RGBColor
    status: known
    source: Inside Macintosh (low memory), 7.5.5-finder-idle snapshot (0,0,0)
    comment: >
      Key Caps uses it with RGBForeColor; Executor left it 0xFF.
  - address: 0xC16
    name: RGBWhite
    type: RGBColor
    status: known
    source: Inside Macintosh (low memory), 7.5.5-finder-idle snapshot (FFFF x3)

  - address: 0xBE0
    name: HelpPackage
    type: Handle
    status: guess
    source: 7.5.5-finder-idle snapshot; System 'ptch' handler for $A830 at RAM $6DB24
    comment: >
      The detached handle to PACK 14 that the Pack14 trap enters through
      CallDetachedPackage ($668) with the lock count at ExpandMem+$130.
      Inside the per-process 'lmem' range $BC2-$BFD.
  - address: 0x286
    name: SystemMenuList
    type: Handle
    status: guess
    source: 7.5.5-finder-idle snapshot (menu list of -16490 and -16489); PACK 14 +1198
    comment: >
      The menu list of the system menus (Help, Application). The Help
      Manager swaps it into MenuList to tell the system's Help menu from
      an application's copy.
  - address: 0xA90
    name: CurLayer
    type: Ptr
    status: guess
    source: Layer Manager (System 'scod' -16463), SetCurLayer at RAM $A59A6
    comment: >
      The current layer; SetCurLayer copies its +$94 into WindowList and
      its +$86/+$8C into AuxWinHead/AuxCtlHead.
  - address: 0x9E2
    name: RootLayer
    type: Ptr
    status: guess
    source: Layer Manager InitLayers at RAM $A58D6 (NewPtr $9C, OpenPort)
    comment: >
      The root layer, a window record; LayerDispatch -5 answers it.

traps: []

# Dispatch traps: one trap word, many routines picked by a selector
# (tools/macdecode/dispatch.py). Multiversal and Universal Interfaces'
# inline glue come first; entries here fill gaps. location uses
# multiversal's spelling: D0W, D0L, D0<mask>, StackW, StackL, TrapBits.
# After editing, regenerate the tracer's table:
#   python3 tools/macdecode/dispatch.py --emit-c src/core/atrap_dispatchers.inc
#
#   - trap: 0xA88F
#     name: OSDispatch
#     selectors:
#       - {value: 0x31, name: ..., status: guess, source: ...}
dispatchers:
  - trap: 0xA88F
    name: OSDispatch
    comment: >
      Apple's Process Manager (System 'scod' -16463 +206) keeps its globals
      at *$0B7C and a selector table at A5-3310: 8-byte entries
      {routine.l, param bytes.w, result bytes.w}, selectors $00-$6A.
    selectors:
      - value: 0x31
        name: AddAppleMenuItem
        status: guess
        source: 7.5.5 trace + disassembly (scod -16463 +3020; Finder CODE 2 +c68)
        comment: >
          22 bytes of params (Pascal order: StringPtr name, short sortGroup,
          short flagA, Handle iconSuite, short flagB, StringPtr info, long
          key), returns OSErr. Finder leaves name on the stack from an
          earlier call, so its own pushes look like 18 bytes. Removes the
          caller's entries with the same key (as $32), then inserts an entry
          {next, suite, owner, key, sortGroup.w, flagA.b, flagB.b,
          NewString(info), [len+2][0][0]name} sorted (sortGroup goes to the
          comparison). Key must be nonzero and name non-empty, else
          paramErr. Finder calls it up to 50 times at startup, once per
          object in the Apple Menu Items folder, after building an icon
          suite for it; the two zero bytes are where the Apple menu draws
          the item's small icon.
      - value: 0x32
        name: RemoveAppleMenuItems
        status: guess
        source: 7.5.5 trace + disassembly (scod +327e -> +9bc2; Finder CODE 2 +93e)
        comment: >
          4 bytes of params (key.l), returns OSErr. Removes the current
          process's entries with that key from the $31 list (key 0: all of
          them), disposing each entry's handles; paramErr if a nonzero key
          matches nothing. Finder calls it with 0 before re-adding.
      - value: 0x40
        name: BeginSystemMode
        status: guess
        source: 7.5.5 se-real trace + call sites (AppleScript ascr +697e, Desktop Manager, scod +acc4)
        comment: >
          No parameters, word result (SUBQ #2,SP; MOVE.W #$40,-(SP);
          _OSDispatch). Brackets FSpOpenResFile / HOpenResFile with $41 so
          the file is opened on behalf of the system rather than the
          calling application.
      - value: 0x41
        name: EndSystemMode
        status: guess
        source: same call sites as $40
        comment: No parameters, word result; ends a $40 bracket.
      - value: 0x14
        name: TakeDesktopLayer
        status: guess
        source: 7.5.5 disassembly (scod, det-a 0x2a282; Finder CODE 185 +26e)
        comment: >
          4 bytes of params (WindowPtr *out), returns OSErr. First caller
          only: *out = the Process Manager's desk layer (PM A5-0x470), owner
          set to the current process, Layer Manager $A829 selector -5 called,
          process +0x70 copied to layer +0x98; later callers get -603. The
          layer is a window-shaped GrafPort over the screen: visRgn = the
          desktop, clipRgn wide open, updateRgn empty, no strucRgn/contRgn.
          Finder adopts visRgn as its desktop window's visRgn and contRgn and
          updateRgn as its updateRgn; it SysErrors(41) on failure.
      - value: 0x42
        name: AddProcessCallback
        status: guess
        source: 7.5.5 disassembly (scod, det-a 0x283fc; Finder CODE 25 +3a)
        comment: >
          8 bytes of params (proc, refCon), returns OSErr. Links a 20-byte
          {next, proc, refCon, current PSN} record into a list at PM
          A5-0x136; memFullErr if the PM heap is full.
      - value: 0x47
        name: GetTempMemInfo
        status: guess
        source: 7.5.5 disassembly (scod, det-a 0x28ed4; Finder CODE 26 +54)
        comment: >
          8 bytes of params (long *first, long *second), returns noErr.
          *first = HeapDispatch $19, *second = HeapDispatch $18 on the PM
          heap; total free vs largest block is our reading.
      - value: 0x55
        name: SetProcessDragHooks
        status: guess
        source: 7.5.5 disassembly (scod, det-a 0x2a508; Finder CODE 32 +20a)
        comment: >
          4 bytes of params (long), returns OSErr. Stores the long at
          current process +0x15C (-600 without a current process). Finder
          passes its drag-hook record when Gestalt 'os  ' bit 10 is set and
          DragDispatch $C301 succeeded.
      - value: 0x5E
        name: SetHideDesktopInBackground
        status: guess
        source: 7.5.5 disassembly (scod table entry $5E -> RAM $28d2c; General Controls DRVR 49 +354)
        comment: >
          1 byte of params (Boolean), word result. Stores the byte in the
          Process Manager globals (A5-$620); when it turns on while the
          front process is not the desk owner (A5-$474), ShowHides that
          process's layer window (+$70) away. General Controls' driver
          passes bit 3 of its 'gprf' flags: "Show Desktop when in
          background" inverted.
  - trap: 0xA825
    name: MenuDispatch
    comment: >
      7.5.5's selector table at RAM $63896 covers -6..1; D0's low byte
      selects, its high byte is the parameter size. -4..-2 and -1 call
      the MBDF with message 14 (a title rectangle into *param2): -4
      passes -2, -3 passes -1, -2 passes 0, -1 the MenuList offset of
      the menu whose ID is on the stack.
    selectors:
      - value: 0xFC
        name: GetSystemMenuTitlesRect
        status: guess
        source: 7.5.5 disassembly (MenuDispatch -4 -> $6352e; System MBDF 0 +$109c; Date & Time INIT +$6c6)
        comment: >
          4 bytes of params (Rect *out), the OSErr written over out->top.
          MBDF parameter -2: from the first system menu's title to the
          last's; empty without system menus. Date & Time's clock ends a
          pixel left of it.
      - value: 0xFD
        name: GetAppMenuTitlesRect
        status: guess
        source: 7.5.5 disassembly (MenuDispatch -3 -> $63534; MBDF +$1106)
        comment: >
          4 bytes of params (Rect *out). MBDF parameter -1: the first
          title's rectangle widened to lastRight.
      - value: 0xFE
        name: GetMenuBarRect
        status: guess
        source: 7.5.5 disassembly (MenuDispatch -2 -> $6353a; MBDF +$988)
        comment: >
          4 bytes of params (Rect *out). MBDF parameter 0: the whole bar
          (the menu bar port's rectangle, MBarHeight tall).
      - value: 0xFF
        name: GetMenuTitleRect
        status: guess
        source: 7.5.5 disassembly (MenuDispatch -1 -> $63572)
        comment: >
          6 bytes of params (menuID.w, Rect *out). Looks the menu up in
          MenuList and asks the MBDF (message 14) for its title rectangle:
          a pixel inside the bar top and bottom, a pixel left of the title,
          three past the next title's left (lastRight after the last
          application menu, the bar's right margin minus 10 for the last
          system menu). paramErr if the ID is not in the bar.
  - trap: 0xA82A
    name: ComponentDispatch
    comment: >
      Component Manager. Universal Interfaces names most selectors; these
      are private ones 7.5.5 code calls.
    selectors:
      - value: 0x19
        name: GetComponentMgrVersion
        status: guess
        source: 7.5.5 Gestalt 'cpnt' function (ext-755 RAM $7B24A)
        comment: >
          No parameters, returns a long: the version Gestalt 'cpnt'
          reports. Executor answers $00030000 (a guess).
      - value: 0x16
        name: RegisterSystemComponent
        status: placeholder
        source: ext-755 trace, System 'boot' 3 (27 calls)
        comment: >
          The System's boot code registers its own components with this;
          Executor registers the System file's 'thng's itself.
      - value: 0x22
        name: FinishSystemComponents
        status: guess
        source: ext-755 trace, System 'boot' 3 (1 call)
        comment: >
          Called once by the System's boot code after its 27 $16 calls,
          before the extensions load; the name only says where it sits.
      - value: 0x64
        name: FindInputWindow
        status: guess
        source: RAM $28C80; PACK 14 +1f64
        comment: >
          (Point, WindowPtr *out) -> part code: TextServicesDispatch $17
          when the TSM is present, else 0.
  - trap: 0xA829
    name: LayerDispatch
    comment: >
      Window Manager layers (System 7). D0's low byte selects (moveq).
    selectors:
      - value: 0x09
        name: AutoPositionWindow
        status: guess
        source: Key Caps DRVR 14 +3b6
        comment: >
          (window, Boolean, byte, byte), no result. Key Caps passes
          (window, false, 1, 2) after CheckWindow fails on its restored
          position.
      - value: 0x0C
        name: CheckWindow
        status: guess
        source: Key Caps DRVR 14 +3a2
        comment: >
          (window, Boolean, byte) -> Boolean. Key Caps passes (window,
          false, 1) on the position it restored from 'kcwn'.
      - value: 0xF6
        name: GetWindowContentRect
        status: guess
        source: Key Caps DRVR 14 +3fc
        comment: >
          (window, Rect *out), no result. Key Caps writes it into its 'kcwn'
          resource on close and reads it back as the window's global
          content rectangle (offsetting its WIND bounds by the top-left).
      - value: 0xFF
        name: GetRootLayer
        status: guess
        source: RAM $A499E (table at the trap's address, kind 2, selectors -10..13)
        comment: >
          () -> LayerPtr: the top of the current layer's parent chain
          (+$82). A layer is a window record with $DEAD at +$4A, its
          parent at +$82, the next layer at +$90, its window list at +$94.
      - value: 0xFB
        name: GetDesktopLayer
        status: guess
        source: RAM $A5F00
        comment: >
          (LayerPtr *out) -> OSErr: the root layer, low memory $9E2.
      - value: 0xF9
        name: GetWindowLayer
        status: guess
        source: RAM $A49CA
        comment: >
          (window) -> LayerPtr: nil gives the current layer, a layer its
          parent, a window the layer whose list holds it (iterating
          with selector -8).
      - value: 0x01
        name: NewLayer
        status: guess
        source: RAM $A587A; PACK 14 +1e90 (HMSetBalloons)
        comment: >
          (LayerPtr *out, Boolean, Boolean, LayerPtr behind, long refCon)
          -> OSErr: a window of WDEF 127 in the current layer. The Help
          Manager's balloon layer has refCon $BADFACE.
      - value: 0x02
        name: IsLayer
        status: guess
        source: RAM $A6084
        comment: (ptr) -> Boolean, +$4A == $DEAD.
      - value: 0x03
        name: GetCurLayer
        status: guess
        source: RAM $A60B0
        comment: () -> LayerPtr, low memory $A90.
      - value: 0x04
        name: SetCurLayer
        status: guess
        source: RAM $A59A6
        comment: >
          (LayerPtr), nil for the root; WindowList, AuxWinHead and
          AuxCtlHead become the layer's.
      - value: 0x05
        name: SwapCurLayer
        status: guess
        source: RAM $A5B10
        comment: (LayerPtr) -> LayerPtr, SetCurLayer answering the old one.
  - trap: 0xA830
    name: Pack14
    comment: >
      The Help Manager. 7.5.5's trap handler (RAM $6DB24, a System patch)
      sends the selectors into the System's PACK 14 through
      CallDetachedPackage ($668) with the handle at $BE0 and the lock
      count at ExpandMem+$130, except 3 (reads the globals' +$11E) and
      -3 (the Process Manager's init: loads the Help menu, MENU -16490,
      gives it its icon title and inserts it in the system menu list).
      The selector word carries the parameter size in words in its high
      byte for the package's dispatch; the negative selectors are called
      as their low byte only (move.w #$FC,d0).
    selectors:
      - value: 0xFC
        name: HMIdle
        status: guess
        source: System SystemTask patch RAM $79826, OSEventAvail patch $6DC4A
        comment: >
          () -> OSErr, while balloons are on and the current process is
          the front one: the balloons for windows ('hwin'), dialog items
          ('hdlg') and menu titles.
      - value: 0xFB
        name: HMDialogIdle
        status: placeholder
        source: System IsDialogEvent patch RAM $6DC1E
      - value: 0xFA
        name: HMLayerCreated
        status: placeholder
        source: Layer Manager NewLayer RAM $A58BC (with the new layer)
  - trap: 0xA81E
    name: SaveRestoreBits
    comment: >
      Private screen-bits save (RAM $6D7B8, table of selectors 1-9). The
      menu bar definition saves the bits under a menu with it, the Help
      Manager those under a balloon; a saved record is 12 bytes, the
      rectangle then a handle to the pixels.
    selectors:
      - value: 0x01
        name: SaveBits
        status: guess
        source: RAM $6D336; PACK 14 +1326, MBDF 0 +de8
        comment: (Rect *bounds, INTEGER purgeable, Handle *out) -> OSErr.
      - value: 0x02
        name: RestoreBits
        status: guess
        source: RAM $6D45C
        comment: (Handle) -> OSErr, through the Window Manager port, then DiscardBits.
      - value: 0x03
        name: DiscardBits
        status: guess
        source: RAM $6D546
        comment: (Handle) -> OSErr.
  - trap: 0xAA54
    name: TextServicesDispatch
    comment: >
      The Text Services Manager (RAM $7148C, a table of 26 long
      addresses; globals off ExpandMem+$64; 14 is SetTextServiceLanguage).
    selectors:
      - value: 0x17
        name: TSMFindWindow
        status: guess
        source: RAM $7138C; PACK 14 +3ebc; OSDispatch $64
        comment: >
          (Point, WindowPtr *out) -> part code: FindWindow in the layer
          OSDispatch $48 answers for the current process (the floating
          input windows).
      - value: 0x16
        name: TSMInputWindowOp
        status: placeholder
        source: RAM $71262; PACK 14 +3bc
        comment: (Ptr record, INTEGER op 1-6) -> OSErr, on the TSM globals.
  - trap: 0xAA68
    name: DialogDispatch
    comment: >
      RAM $6A02C, table kind 2, selectors -5..8.
    selectors:
      - value: 0x01
        name: GetFrontWindowModalClass
        status: guess
        source: RAM $69C7E; PACK 14 +8b2, +3f68
        comment: (INTEGER *class) -> OSErr, GetWindowModalClass of FrontWindow.
      - value: 0x02
        name: GetWindowModalClass
        status: guess
        source: RAM $69BF4
        comment: >
          (window, INTEGER *class) -> OSErr: the variant when the window
          is dBoxProc (1) or movableDBoxProc (5) of WDEF 0, else 0; a 1 is
          cached in the window's spare flag bit 7.
      - value: 0xFF
        name: DialogMenuState
        status: guess
        source: RAM $69BDC; PACK 14 +150
        comment: >
          Pushed: a menu's offset in MenuList; the routine pushes its
          answer (the offset of the menu to use) above it and the caller
          pops both.
      - value: 0xFE
        name: DialogMenuStateApply
        status: guess
        source: RAM $69786; PACK 14 +16c
        comment: >
          Pops the long from DialogMenuState, adjusting the menu's enable
          flags left on the stack under it.
  - trap: 0xA822
    name: ResourceDispatch
    selectors:
      - value: 0xFF
        name: ResourceMapIsSystem
        status: guess
        source: RAM $6CA26; PACK 14 +1426
        comment: >
          (Handle map) -> Boolean: the System file's map, or one whose
          header says the system's; ResErr resFNotFound for nil.
  - trap: 0xABC9
    name: IconDispatch
    selectors:
      - value: 0x218
        name: SetIconDrawContext
        status: guess
        source: 7.5.5 disassembly (Icon Utilities table at det-c 0x690fc, entry 0x68b76; Finder CODE 117 +2fe)
        comment: >
          4 bytes of params (long), no result. With Color QuickDraw stores
          the long at icon globals (**(ExpandMem+0x174)) +0x260. Finder sets
          it to an object field around calling the object's draw proc and
          clears it after. Shares its body with $220.
      - value: 0x220
        name: GetIconDrawContext
        status: guess
        source: 7.5.5 disassembly (entry 0x68b72)
        comment: >
          4 bytes of params (long *out), no result: *out = the value $218
          stored (nil without Color QuickDraw).
  - trap: 0xA823
    name: AliasDispatch
    selectors:
      - value: 0x0A
        name: FindFolderWithTable
        status: guess
        source: Finder Scripting Extension's FindFolder patch (INIT 128, disassembly)
        comment: >
          FindFolder's arguments plus a trailing pointer to folder
          descriptions ({type.l, name length.l, name}: 'shdf' Shutdown Items,
          'timf' Timer Items). The patch switches D0 0 -> $A for those types
          and jumps to the saved routine, so traces never show the selector.
      - value: 0x0E
        name: GetFolderName
        status: guess
        source: Finder Scripting Extension code (disassembly), later Folders.h
        comment: >
          (vRefNum, folderType, short *foundVRefNum, StringPtr name) ->
          OSErr. FSE asks it for the Trash's name when making a folder.

# Tags: entry points below the Toolbox Executor provides. A tagged entry
# point that only Apple ROM/patch code calls is "not needed" for that
# reason; code we run calling it still makes it needed. Review freely:
# tag is hardware | boot | debug; selector is optional (whole trap if
# absent).


tags:
  # hardware: Executor talks to the host, not to Mac hardware
  - {trap: 0xA07C, name: ADBOp, tag: hardware, reason: ADB bus transaction; input comes from the host}
  - {trap: 0xA077, name: CountADBs, tag: hardware, reason: ADB device table}
  - {trap: 0xA078, name: GetIndADB, tag: hardware, reason: ADB device table}
  - {trap: 0xA079, name: GetADBInfo, tag: hardware, reason: ADB device table}
  - {trap: 0xA07A, name: SetADBInfo, tag: hardware, reason: ADB device table}
  - {trap: 0xA07B, name: ADBReInit, tag: hardware, reason: ADB bus reset}
  - {trap: 0xA815, name: SCSIDispatch, tag: hardware, reason: SCSI bus; disks are host files}
  - {trap: 0xA089, name: SCSIAtomic, tag: hardware, reason: SCSI Manager 4.3}
  - {trap: 0xA06E, name: SlotManager, tag: hardware, reason: NuBus slot ROMs}
  - {trap: 0xA075, name: SIntInstall, tag: hardware, reason: slot interrupt handlers}
  - {trap: 0xA076, name: SIntRemove, tag: hardware, reason: slot interrupt handlers}
  - {trap: 0xA06F, name: SlotVInstall, tag: hardware, reason: per-slot VBL tasks}
  - {trap: 0xA070, name: SlotVRemove, tag: hardware, reason: per-slot VBL tasks}
  - {trap: 0xA071, name: AttachVBL, tag: hardware, reason: binds VBL tasks to a video slot}
  - {trap: 0xA072, name: DoVBLTask, tag: hardware, reason: run by the video interrupt}
  - {trap: 0xA051, name: ReadXPRam, tag: hardware, reason: parameter RAM chip}
  - {trap: 0xA052, name: WriteXPRam, tag: hardware, reason: parameter RAM chip}
  - {trap: 0xA053, name: ClkNoMem, tag: hardware, reason: clock chip access}
  - {trap: 0xA05B, name: PowerOff, tag: hardware, reason: power hardware}
  - {trap: 0xA085, name: PMgrOp, tag: hardware, reason: Power Manager microcontroller}
  - {trap: 0xA09E, name: PowerMgrDispatch, tag: hardware, reason: Power Manager}
  - {trap: 0xA05D, name: SwapMMUMode, tag: hardware, reason: 24/32-bit MMU mode}
  - {trap: 0xA091, name: Translate24To32, tag: hardware, reason: 24-bit addressing}
  - {trap: 0xA080, name: GetVideoDefault, tag: hardware, reason: video slot defaults in PRAM}
  - {trap: 0xA081, name: SetVideoDefault, tag: hardware, reason: video slot defaults in PRAM}
  - {trap: 0xA084, name: GetOSDefault, tag: hardware, reason: startup OS defaults in PRAM}
  - {trap: 0xA083, name: SetOSDefault, tag: hardware, reason: startup OS defaults in PRAM}
  - {trap: 0xA07D, name: GetDefaultStartup, tag: hardware, reason: startup device in PRAM}
  - {trap: 0xA07E, name: SetDefaultStartup, tag: hardware, reason: startup device in PRAM}
  - {trap: 0xA07F, name: InternalWait, tag: hardware, reason: hardware wait states}
  - {trap: 0xA086, name: IOPInfoAccess, tag: hardware, reason: I/O processor}
  - {trap: 0xA087, name: IOPMsgRequest, tag: hardware, reason: I/O processor}
  - {trap: 0xA088, name: IOPMoveData, tag: hardware, reason: I/O processor}
  # boot: run while the system starts, before any application
  - {trap: 0xA06C, name: InitFS, tag: boot, reason: File Manager start-up}
  - {trap: 0xA06D, name: InitEvents, tag: boot, reason: Event Manager start-up}
  - {trap: 0xA03F, name: InitUtil, tag: boot, reason: PRAM/clock start-up}
  - {trap: 0xA995, name: InitResources, tag: boot, reason: opens the System file at start-up}
  - {trap: 0xA9E6, name: InitAllPacks, tag: boot, reason: start-up}
  - {trap: 0xA057, name: SetApplBase, tag: boot, reason: start-up heap layout}
  - {trap: 0xA02C, name: InitApplZone, tag: boot, reason: start-up / launch heap layout (Executor does this in C++)}
  - {trap: 0xA996, name: RsrcZoneInit, tag: boot, reason: closes resource files at launch}
  - {trap: 0xA03D, name: DrvrInstall, tag: boot, reason: driver installation by the system and INITs}
  - {trap: 0xA03E, name: DrvrRemove, tag: boot, reason: driver removal}
  - {trap: 0xA04F, name: RDrvrInstall, tag: boot, reason: ROM driver installation}
  - {trap: 0xA04E, name: AddDrive, tag: boot, reason: drive queue set-up by disk drivers}
  # debug: debugger hooks
  - {trap: 0xA08D, name: DebugUtil, tag: debug, reason: low-level debugger interface}
  - {trap: 0xA9FF, name: Debugger, tag: debug, reason: breaks into MacsBug}
  - {trap: 0xABFF, name: DebugStr, tag: debug, reason: breaks into MacsBug}
