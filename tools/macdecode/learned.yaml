# What we've learned that multiversal doesn't say (yet).
#
# Layered over src/executor/multiversal/defs by macdecode: an entry here
# adds a name or replaces multiversal's entry at the same address/trap.
# Multiversal itself stays untouched until we decide to fold these in.
#
# status: known (documented or proven) | guess (plausible, unproven)
#         | placeholder (nonzero, meaning unknown)
# replaces: the multiversal name this overrides, as a reminder
# source: where we learned it (Inside Mac page, disassembly, snapshot)

lowmem:
  - address: 0x2B6
    name: ExpandMem
    type: Ptr
    status: known
    replaces: AE_info
    source: Inside Macintosh (System 7 low memory), MEMORY_MAP.md
    comment: >
      Pointer to ExpandMemRec (Gestalt table, Script Manager and other
      post-128K-ROM globals). Executor reuses this slot for AppleEvents
      state under the name AE_info.

traps: []

# Dispatch traps: one trap word, many routines picked by a selector
# (tools/macdecode/dispatch.py). Multiversal and Universal Interfaces'
# inline glue come first; entries here fill gaps. location uses
# multiversal's spelling: D0W, D0L, D0<mask>, StackW, StackL, TrapBits.
# After editing, regenerate the tracer's table:
#   python3 tools/macdecode/dispatch.py --emit-c src/core/atrap_dispatchers.inc
#
#   - trap: 0xA88F
#     name: OSDispatch
#     selectors:
#       - {value: 0x31, name: ..., status: guess, source: ...}
dispatchers:
  - trap: 0xA88F
    name: OSDispatch
    comment: >
      Apple's Process Manager (System 'scod' -16463 +206) keeps its globals
      at *$0B7C and a selector table at A5-3310: 8-byte entries
      {routine.l, param bytes.w, result bytes.w}, selectors $00-$6A.
    selectors:
      - value: 0x31
        name: AddAppleMenuItem
        status: guess
        source: 7.5.5 trace + disassembly (scod +3020; Finder CODE 2 +c68)
        comment: >
          16 bytes of params, returns OSErr. Adds an entry to a list the
          Process Manager owns (head at PM A5-1200; entries are handles in
          the PM heap): first removes the caller's entries with the same
          key (as $32), then inserts a copy of the name string in sorted
          order. Key (long) must be nonzero and the name non-empty, else
          paramErr. Finder calls it up to 50 times at startup, once per
          object, after building an icon suite for it. Name: in System 7
          the Process Manager draws the Apple menu and Finder feeds it the
          Apple Menu Items folder (sorted by name, small icons, 50-item
          limit), which this matches.
      - value: 0x32
        name: RemoveAppleMenuItems
        status: guess
        source: 7.5.5 trace + disassembly (scod +327e -> +9bc2; Finder CODE 2 +93e)
        comment: >
          4 bytes of params (key.l), returns OSErr. Removes the current
          process's entries with that key from the $31 list (key 0: all of
          them), disposing each entry's handles; paramErr if a nonzero key
          matches nothing. Finder calls it with 0 before re-adding.

# Tags: entry points below the Toolbox Executor provides. A tagged entry
# point that only Apple ROM/patch code calls is "not needed" for that
# reason; code we run calling it still makes it needed. Review freely:
# tag is hardware | boot | debug; selector is optional (whole trap if
# absent).
tags:
  # hardware: Executor talks to the host, not to Mac hardware
  - {trap: 0xA07C, name: ADBOp, tag: hardware, reason: ADB bus transaction; input comes from the host}
  - {trap: 0xA077, name: CountADBs, tag: hardware, reason: ADB device table}
  - {trap: 0xA078, name: GetIndADB, tag: hardware, reason: ADB device table}
  - {trap: 0xA079, name: GetADBInfo, tag: hardware, reason: ADB device table}
  - {trap: 0xA07A, name: SetADBInfo, tag: hardware, reason: ADB device table}
  - {trap: 0xA07B, name: ADBReInit, tag: hardware, reason: ADB bus reset}
  - {trap: 0xA815, name: SCSIDispatch, tag: hardware, reason: SCSI bus; disks are host files}
  - {trap: 0xA089, name: SCSIAtomic, tag: hardware, reason: SCSI Manager 4.3}
  - {trap: 0xA06E, name: SlotManager, tag: hardware, reason: NuBus slot ROMs}
  - {trap: 0xA075, name: SIntInstall, tag: hardware, reason: slot interrupt handlers}
  - {trap: 0xA076, name: SIntRemove, tag: hardware, reason: slot interrupt handlers}
  - {trap: 0xA06F, name: SlotVInstall, tag: hardware, reason: per-slot VBL tasks}
  - {trap: 0xA070, name: SlotVRemove, tag: hardware, reason: per-slot VBL tasks}
  - {trap: 0xA071, name: AttachVBL, tag: hardware, reason: binds VBL tasks to a video slot}
  - {trap: 0xA072, name: DoVBLTask, tag: hardware, reason: run by the video interrupt}
  - {trap: 0xA051, name: ReadXPRam, tag: hardware, reason: parameter RAM chip}
  - {trap: 0xA052, name: WriteXPRam, tag: hardware, reason: parameter RAM chip}
  - {trap: 0xA053, name: ClkNoMem, tag: hardware, reason: clock chip access}
  - {trap: 0xA05B, name: PowerOff, tag: hardware, reason: power hardware}
  - {trap: 0xA085, name: PMgrOp, tag: hardware, reason: Power Manager microcontroller}
  - {trap: 0xA09E, name: PowerMgrDispatch, tag: hardware, reason: Power Manager}
  - {trap: 0xA05D, name: SwapMMUMode, tag: hardware, reason: 24/32-bit MMU mode}
  - {trap: 0xA091, name: Translate24To32, tag: hardware, reason: 24-bit addressing}
  - {trap: 0xA080, name: GetVideoDefault, tag: hardware, reason: video slot defaults in PRAM}
  - {trap: 0xA081, name: SetVideoDefault, tag: hardware, reason: video slot defaults in PRAM}
  - {trap: 0xA084, name: GetOSDefault, tag: hardware, reason: startup OS defaults in PRAM}
  - {trap: 0xA083, name: SetOSDefault, tag: hardware, reason: startup OS defaults in PRAM}
  - {trap: 0xA07D, name: GetDefaultStartup, tag: hardware, reason: startup device in PRAM}
  - {trap: 0xA07E, name: SetDefaultStartup, tag: hardware, reason: startup device in PRAM}
  - {trap: 0xA07F, name: InternalWait, tag: hardware, reason: hardware wait states}
  - {trap: 0xA086, name: IOPInfoAccess, tag: hardware, reason: I/O processor}
  - {trap: 0xA087, name: IOPMsgRequest, tag: hardware, reason: I/O processor}
  - {trap: 0xA088, name: IOPMoveData, tag: hardware, reason: I/O processor}
  # boot: run while the system starts, before any application
  - {trap: 0xA06C, name: InitFS, tag: boot, reason: File Manager start-up}
  - {trap: 0xA06D, name: InitEvents, tag: boot, reason: Event Manager start-up}
  - {trap: 0xA03F, name: InitUtil, tag: boot, reason: PRAM/clock start-up}
  - {trap: 0xA995, name: InitResources, tag: boot, reason: opens the System file at start-up}
  - {trap: 0xA9E6, name: InitAllPacks, tag: boot, reason: start-up}
  - {trap: 0xA057, name: SetApplBase, tag: boot, reason: start-up heap layout}
  - {trap: 0xA02C, name: InitApplZone, tag: boot, reason: start-up / launch heap layout (Executor does this in C++)}
  - {trap: 0xA996, name: RsrcZoneInit, tag: boot, reason: closes resource files at launch}
  - {trap: 0xA03D, name: DrvrInstall, tag: boot, reason: driver installation by the system and INITs}
  - {trap: 0xA03E, name: DrvrRemove, tag: boot, reason: driver removal}
  - {trap: 0xA04F, name: RDrvrInstall, tag: boot, reason: ROM driver installation}
  - {trap: 0xA04E, name: AddDrive, tag: boot, reason: drive queue set-up by disk drivers}
  # debug: debugger hooks
  - {trap: 0xA08D, name: DebugUtil, tag: debug, reason: low-level debugger interface}
  - {trap: 0xA9FF, name: Debugger, tag: debug, reason: breaks into MacsBug}
  - {trap: 0xABFF, name: DebugStr, tag: debug, reason: breaks into MacsBug}
