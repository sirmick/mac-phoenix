<!doctype html>
<!-- Executor in a tab (docs/executor/DIRECTION.md, W2/W3): no ROM, no server
     beyond static files. The module runs in worker.js; this page shows its
     frames on an OffscreenCanvas, sends it mouse and keyboard input, and
     keeps the disk images and applications you add in the browser's
     private storage (OPFS). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Executor</title>
<style>
  html, body { margin: 0; height: 100%; background: #333; color: #ccc;
               font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 8px; }
  #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar button, #bar label { background: #555; color: #eee; border: 0;
         border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #files span { background: #444; border-radius: 4px; padding: 2px 6px; margin-right: 4px; }
  #files a { color: #f88; margin-left: 4px; cursor: pointer; }
  #bar select { background: #444; color: #eee; border: 0; font: inherit; }
  canvas { background: #000; image-rendering: pixelated;
           outline: none; max-width: 100vw; max-height: calc(100vh - 64px); }
</style>
</head>
<body>
<div id="bar">
  <label>Add disk image or application…<input id="add" type="file" multiple hidden></label>
  <span id="files"></span>
  <label title="Apple's System and Finder from one of your disk images">System
    <select id="system"><option value="">Executor's own</option></select></label>
  <button id="restart">Restart</button>
</div>
<div id="screen-box"></div>
<div id="status">Loading Executor…</div>
<script src="keys.js"></script>
<script src="cursor.js"></script>
<script src="main.js"></script>
</body>
</html>
