<!doctype html>
<!-- Executor in a tab (docs/executor/DIRECTION.md, W2/W3): no ROM, served by
     tools/standalone, which keeps what it changes. The module runs in
     worker.js; this page shows its frames on an OffscreenCanvas and sends
     it mouse and keyboard input. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Executor</title>
<style>
  html, body { margin: 0; height: 100%; background: #333; color: #ccc;
               font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 8px; }
  #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar button, #bar label { background: #555; color: #eee; border: 0;
         border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #bar select { background: #444; color: #eee; border: 0; font: inherit; }
  #viewer { background: #345; color: #cdf; border-radius: 4px; padding: 4px 10px; }
  #viewer button { background: #567; color: #eee; border: 0; border-radius: 4px; padding: 2px 8px; font: inherit; cursor: pointer; }
  #status.lost { background: #543; color: #fda; border-radius: 4px; padding: 4px 10px; }
  /* Sized by main.js: a whole number of device pixels a guest pixel. */
  canvas { background: #000; image-rendering: pixelated; outline: none; }
</style>
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="disks.css">
</head>
<body>
<div id="bar">
  <button id="disks-button" title="Disks: the System the Mac starts from, the disks in it, the library; add your own">Disks</button>
  <input id="add" type="file" multiple hidden>
  <label title="Run fat applications' PowerPC code (PowerPC-only ones always do)"><input id="ppc" type="checkbox">PowerPC</label>
  <button id="restart">Restart</button>
  <button id="shot" title="Send a picture of the screen to the server, for a look later (with what this page printed)">Screenshot</button>
</div>
<div id="viewer" hidden>Executor is open in another tab, which has control: its screen, here.
  <button id="take">Take control</button></div>
<div id="screen-box"></div>
<div id="status">Loading Executor…</div>
<script src="log.js"></script>
<script src="keys.js"></script>
<script src="settings.js"></script>
<script src="cursor.js"></script>
<script src="disks.js"></script>
<script src="main.js"></script>
</body>
</html>
