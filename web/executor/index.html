<!doctype html>
<!-- Executor in a tab (docs/executor/DIRECTION.md, W2): no ROM, no server
     beyond static files. The module runs in worker.js; this page shows its
     frames on an OffscreenCanvas and sends it mouse and keyboard input. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Executor</title>
<style>
  html, body { margin: 0; height: 100%; background: #333; color: #ccc;
               font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 8px; }
  canvas { background: #000; image-rendering: pixelated; cursor: none;
           outline: none; max-width: 100vw; max-height: calc(100vh - 32px); }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480" tabindex="0"></canvas>
<div id="status">Loading Executor…</div>
<script src="keys.js"></script>
<script src="main.js"></script>
</body>
</html>
