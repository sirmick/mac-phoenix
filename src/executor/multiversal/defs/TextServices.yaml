# MacPhoenix: the Text Services Manager's trap, as far as Apple's Help
# Manager (helppkg.cpp) needs it, and a TSM without input methods: the
# document calls accept, events and menus are never a text service's
# (REALbasic's runtime makes a TSM document for every window on 8.6:
# GameBox Classic).

- typedef:
    name: TSMDocumentID
    type: Ptr

- dispatcher:
    name: TextServicesDispatch
    trap: 0xAA54
    selector-location: D0W
    comment: |
      MacPhoenix: 7.5.5's handler is a table of 26 long addresses
      (selectors 0-25: NewTSMDocument, DeleteTSMDocument, ...,
      SetTextServiceLanguage is 14); its globals hang off ExpandMem+$64.
      Only the two private selectors the Help Manager calls while
      balloons are on are here; their names are guesses.

# ####

- function:
    name: TSMFindWindow
    return: INTEGER
    args:
      - name: pt
        type: Point
      - name: window
        type: WindowPtr*
    dispatcher: TextServicesDispatch
    selector: 0x0017
    executor: C_
    comment: |
      Selector 23: FindWindow among the TSM's floating input windows
      (Apple's switches to the layer OSDispatch $48 answers and calls
      FindWindow there; the Process Manager's OSDispatch $64 is this
      call). The Help Manager treats a hit as "not mine". No such
      windows here: 0 and nil.

# ####

- function:
    name: TSMInputWindowOp
    return: OSErr
    args:
      - name: record
        type: Ptr
      - name: op
        type: INTEGER
    dispatcher: TextServicesDispatch
    selector: 0x0016
    executor: C_
    comment: |
      Selector 22: operations (1-6) on the floating input window's state
      in the TSM globals. paramErr here; the Help Manager takes that as
      "no input window".

# ####

# TextServices.h: an application that handles inline input itself says so
# (8.x control panels and Sherlock call it first thing). Executor has no
# input methods: noErr, nothing to do.
- function:
    name: InitTSMAwareApplication
    return: OSErr
    dispatcher: TextServicesDispatch
    selector: 0x0014
    executor: C_

# ####

- function:
    name: CloseTSMAwareApplication
    return: OSErr
    dispatcher: TextServicesDispatch
    selector: 0x0015
    executor: C_

# ####

- function:
    name: NewTSMDocument
    return: OSErr
    args:
      - name: numOfInterface
        type: INTEGER
      - name: supportedInterfaces
        type: OSType*
      - name: idocID
        type: TSMDocumentID*
      - name: refcon
        type: LONGINT
    dispatcher: TextServicesDispatch
    selector: 0x0000
    executor: C_

# ####

- function:
    name: DeleteTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: TSMDocumentID
    dispatcher: TextServicesDispatch
    selector: 0x0001
    executor: C_

# ####

- function:
    name: ActivateTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: TSMDocumentID
    dispatcher: TextServicesDispatch
    selector: 0x0002
    executor: C_

# ####

- function:
    name: DeactivateTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: TSMDocumentID
    dispatcher: TextServicesDispatch
    selector: 0x0003
    executor: C_

# ####

- function:
    name: TSMEvent
    return: Boolean
    args:
      - name: event
        type: EventRecord*
    dispatcher: TextServicesDispatch
    selector: 0x0004
    executor: C_

# ####

- function:
    name: TSMMenuSelect
    return: Boolean
    args:
      - name: menuResult
        type: LONGINT
    dispatcher: TextServicesDispatch
    selector: 0x0005
    executor: C_

# ####

- function:
    name: SetTSMCursor
    return: Boolean
    args:
      - name: mousePos
        type: Point
    dispatcher: TextServicesDispatch
    selector: 0x0006
    executor: C_

# ####

- function:
    name: FixTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: TSMDocumentID
    dispatcher: TextServicesDispatch
    selector: 0x0007
    executor: C_

# ####

- function:
    name: UseInputWindow
    return: OSErr
    args:
      - name: idocID
        type: TSMDocumentID
      - name: useWindow
        type: Boolean
    dispatcher: TextServicesDispatch
    selector: 0x0010
    executor: C_
