# MathLib: the Power Mac's maths library, as Executor answers it
# (romlib/clib/mathlib.cpp; docs/executor/PPCLibs.md). Only for Executor,
# as StdCLib. The h_ routines are the m_ ones with the host's floating-point
# exception flags carried over to the guest's FPSCR; the l routines take
# MathLib's double-double in f1:f2 and are raw.

# ---- mathlib.cpp -------------------------------------------------

- only-for: Executor
  function:
    name: "cos"
    return: "double"
    args:
      - name: "x"
        type: "double"
    library: MathLib
    executor: h_cos

