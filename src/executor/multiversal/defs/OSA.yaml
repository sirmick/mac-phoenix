# The Open Scripting Architecture (Inside Macintosh: Interapplication
# Communication ch. 10): calls into a scripting component (AppleScript's,
# or the generic one), each a component call through _ComponentDispatch
# with its selector. Apple's components answer them; Executor exports them
# from AppleScriptLib for CFM-68K code (COMPONENT_CALL, cfm68k_glue.cpp),
# PowerPC code uses Apple's AppleScriptLib through CallComponentUPP.

- typedef:
    name: OSAID
    type: uint32_t

# ####

- typedef:
    name: OSAError
    type: ComponentResult

# ####

- typedef:
    name: ScriptingComponentSelector
    type: OSType

# ####

- funptr:
    name: OSAActiveUPP
    return: OSErr
    args:
      - name: refCon
        type: LONGINT

# ####

- funptr:
    name: OSASendUPP
    return: OSErr
    args:
      - name: theAppleEvent
        type: const AppleEvent*
      - name: reply
        type: AppleEvent*
      - name: sendMode
        type: AESendMode
      - name: sendPriority
        type: AESendPriority
      - name: timeOutInTicks
        type: LONGINT
      - name: idleProc
        type: IdleUPP
      - name: filterProc
        type: EventFilterUPP
      - name: refCon
        type: LONGINT

# ####

- funptr:
    name: OSACreateAppleEventUPP
    return: OSErr
    args:
      - name: theAEEventClass
        type: AEEventClass
      - name: theAEEventID
        type: AEEventID
      - name: target
        type: const AEAddressDesc*
      - name: returnID
        type: INTEGER
      - name: transactionID
        type: LONGINT
      - name: result
        type: AppleEvent*
      - name: refCon
        type: LONGINT

# ####

- enum:
    values:
      - name: kOSAComponentType
        value: "'osa '"
      - name: kOSAGenericScriptingComponentSubtype
        value: "'scpt'"
      - name: kOSAFileType
        value: "'osas'"
      - name: kOSASuite
        value: "'ascr'"
      - name: kOSANullScript
        value: 0
      - name: kOSANullMode
        value: 0
      - name: kOSAModeNull
        value: 0
      - name: kOSAModePreventGetSource
        value: 1
      - name: kOSAModeCompileIntoContext
        value: 2
      - name: kOSAModeAugmentContext
        value: 4
      - name: kOSAModeDisplayForHumans
        value: 8
      - name: kOSAModeNeverInteract
        value: 16
      - name: kOSAModeCanInteract
        value: 32
      - name: kOSAModeAlwaysInteract
        value: 48
      - name: kOSAModeCantSwitchLayer
        value: 64
      - name: kOSAModeDontReconnect
        value: 128
      - name: kOSAModeDoRecord
        value: 4096
      - name: kOSAModeDontStoreParent
        value: 65536

# ####

- enum:
    values:
      - name: errOSASystemError
        value: -1750
      - name: errOSAInvalidID
        value: -1751
      - name: errOSABadStorageType
        value: -1752
      - name: errOSAScriptError
        value: -1753
      - name: errOSABadSelector
