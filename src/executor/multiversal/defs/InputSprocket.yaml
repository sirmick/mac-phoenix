# MacPhoenix: InputSprocket (Game Sprockets, InputSprocket.h 1.7): game
# input through "needs" the application lists and virtual elements the
# devices' drivers feed. PowerPC only, InputSprocketLib from the
# InputSprocket extension; no 68k interface. Executor answers it in C++
# (romlib/inputsprocket.cpp) as a Mac with InputSprocket and no devices
# to configure: the elements stay idle, so a game falls back to the
# keyboard it reads itself (Slithereens, Mars Rising: M1.md #15).

- struct:
    name: OpaqueISpElementReference

- typedef:
    name: ISpElementReference
    type: OpaqueISpElementReference*

- struct:
    name: OpaqueISpElementListReference

- typedef:
    name: ISpElementListReference
    type: OpaqueISpElementListReference*

- struct:
