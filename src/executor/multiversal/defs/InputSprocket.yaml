- struct:
    name: ISpNeed
    members:
      - name: name
        type: Str63
      - name: iconSuiteResourceId
        type: INTEGER
      - name: playerNum
        type: UInt8
      - name: group
        type: UInt8
      - name: theKind
        type: ISpElementKind
      - name: theLabel
        type: ISpElementLabel
      - name: flags
        type: ISpNeedFlagBits
      - name: reserved1
        type: UInt32
      - name: reserved2
        type: UInt32
      - name: reserved3
        type: UInt32
    size: 92

- struct:
    name: ISpElementEvent
    members:
      - name: when
        type: AbsoluteTime
      - name: element
        type: ISpElementReference
      - name: refCon
        type: UInt32
      - name: data
        type: UInt32
    size: 20

- typedef:
    name: ISpElementEventPtr
    type: ISpElementEvent*

- funptr:
    name: ISpEventProcPtr
    return: Boolean
    args:
      - name: inEvent
        type: EventRecord*
    callconv: C

