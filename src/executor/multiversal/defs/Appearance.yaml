# MacPhoenix: the Appearance Manager (Mac OS 8.0; Universal Interfaces 3.4's
# Appearance.h, docs/executor/Appearance.md): themes, their brushes, colours,
# fonts and metrics, and the drawing of windows, controls and menus in them.
# On 8.x it is the System's AppearanceLib (PowerPC code; 68k code reaches the
# Appearance 1.0 calls through _AppearanceDispatch, $AA74). Executor's own
# (appearance_mgr.cpp) answers both, and CFM takes Executor's AppearanceLib
# over the System's. Declarations from tools/multiversal/uih2yaml.py, edited.

- dispatcher:
    name: AppearanceDispatch
    trap: 0xAA74
    selector-location: D0W
    comment: |
      The selector in D0 (THREEWORDINLINE(0x303C, sel, 0xAA74): move.w
      #sel, D0), Pascal arguments on the stack.

