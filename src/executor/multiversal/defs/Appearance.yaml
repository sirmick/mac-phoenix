# MacPhoenix: AppearanceLib's private calls the 8.6 Appearance control panel
# makes (arguments from its call sites, tools/macdecode/pef.py --dis).
# The small system font's name for a script (-1: the system's).
- function:
    name: GetSmallSystemFont
    return: OSStatus
    args:
      - name: script
        type: ScriptCode
      - name: outFontName
        type: StringPtr
    library: AppearanceLib
    executor: C_

