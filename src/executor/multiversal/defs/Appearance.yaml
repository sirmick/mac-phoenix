# Not in Appearance.h: AppearanceLib's (the Finder's views font, for its
# windows and desktop). The Finder passes the script (-1) and wants a name
# and a size; an error or an empty name and it uses the application font.
- function:
    name: GetViewsFont
    return: OSStatus
    args:
      - name: script
        type: ScriptCode
      - name: outFontName
        type: StringPtr
      - name: outFontSize
        type: SInt16*
    library: AppearanceLib
    executor: C_

