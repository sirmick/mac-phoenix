- funptr:
    args:
      - name: theEvent
        type: AppleEvent*
    name: DMNotificationUPP

# ####

- dispatcher:
    name: DisplayDispatch
    trap: 0xABEB
    selector-location: D0<0xFF>
    comment: |
      Like the real 7.5.5 dispatcher (through lowmem $7B0), only D0's low
      byte selects; the high byte is the parameter size in words.

# ####

- function:
    name: DMRegisterNotifyProc
    return: OSErr
    args:
      - name: proc
        type: DMNotificationUPP
      - name: psn
        type: ProcessSerialNumber*
    dispatcher: DisplayDispatch
    selector: 0x0414
    executor: C_

# ####

- function:
    name: DMRemoveNotifyProc
    return: OSErr
    args:
      - name: proc
        type: DMNotificationUPP
      - name: psn
        type: ProcessSerialNumber*
    dispatcher: DisplayDispatch
    selector: 0x0415
    executor: C_

# ####

# MacPhoenix: Display Manager 2.0's extended notifications (Displays.h).
# Apple Menu Options registers one at startup.
- function:
    name: DMRegisterExtendedNotifyProc
    return: OSErr
    args:
      - name: proc
        type: ProcPtr
      - name: userData
        type: void*
      - name: flags
        type: uint16_t
      - name: psn
        type: ProcessSerialNumber*
    dispatcher: DisplayDispatch
    selector: 0x07EF
    executor: C_

# ####

- function:
