# Open Transport 1.1's client interface (OpenTransport.h): its types and
# constants as Apple's headers declare them, and the calls Executor answers
# (romlib/opentransport/, docs/executor/OpenTransport.md). The Internet part
# is OpenTptInternet.yaml.
#
# Each call Executor answers is reached two ways: 68k code binds it through
# the Shared Library Manager by its function set and that set's name for it
# (`aslm:`; the sets name their Pascal routines in capitals), PowerPC code
# imports it from its CFM library (`library:`, under Apple's name).
# Executor's routine reads its arguments through ot::Call (`uint32_t
# f(const ot::Call &)`), from the 68k stack or the PowerPC registers; the
# generator gives it a letter per argument from the type's size (a long, a
# word, Boolean). `callconv:` is the 68k entry's convention.
#
# Some calls Apple's glue makes from others (InitOpenTransport,
# OTOpenEndpoint, OTAlloc...): the library exports a ...Priv routine that
# takes the client's record last. Those are declared for the C side only,
# and custom/OpenTransportGlue.c defines them. On 68k the C side calls every
# `aslm:` routine through the Shared Library Manager, by its set and its
# 1-based index there (`index:`; Apple's ASLM has no names for OT's sets).
#
# Written from Apple's OT 1.1 headers' declarations and Inside Macintosh:
# Networking with Open Transport; size_t is OTByteCount (32 bits on both
# processors, as in Apple's later headers). 68k alignment, as Apple's.

# ---- Gestalt -----------------------------------------------------

- enum:
    values:
      - name: gestaltOpenTptVersions
        value: "'otvr'"
      - name: gestaltOpenTptPresent
        value: 0x00000001
      - name: gestaltOpenTptLoaded
        value: 0x00000002
      - name: gestaltOpenTptAppleTalkPresent
        value: 0x00000004
      - name: gestaltOpenTptAppleTalkLoaded
        value: 0x00000008
      - name: gestaltOpenTptTCPPresent
        value: 0x00000010
      - name: gestaltOpenTptTCPLoaded
        value: 0x00000020
      - name: gestaltOpenTptIPXSPXPresent
        value: 0x00000040
      - name: gestaltOpenTptIPXSPXLoaded
        value: 0x00000080

