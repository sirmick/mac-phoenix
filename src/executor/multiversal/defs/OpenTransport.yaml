# Open Transport 1.1's client calls, as Executor answers them
# (romlib/opentransport/, docs/executor/OpenTransport.md). Each is reached
# two ways: 68k code binds it through the Shared Library Manager by its
# function set and that set's name for it (`aslm:`; the sets name their
# Pascal routines in capitals), PowerPC code imports it from its CFM library
# (`library:`, under Apple's name). Executor's routine reads its arguments
# through ot::Call (`uint32_t f(const ot::Call &)`), from the 68k stack or
# the PowerPC registers, so the argument types here are only their sizes
# (uint32_t a long or pointer, uint16_t a word, Boolean); OT's own types,
# for the C side, are still to be written. Only for Executor until then.

# ---- ot_client.cpp -----------------------------------------------

- only-for: Executor
  function:
    name: "InitOpenTransportPriv"
    return: "uint32_t"
    args:
      - name: "arg1"
        type: "uint32_t"
      - name: "arg2"
        type: "uint32_t"
    library: OTClientUtilLib
    aslm: { set: "OTClnt$LclUtils", name: "InitOpenTransportPriv" }
    callconv: C
    executor: init_priv

- only-for: Executor
  function:
    name: "CloseOpenTransportPriv"
    args:
      - name: "arg1"
        type: "uint32_t"
    library: OTClientUtilLib
    aslm: { set: "OTClnt$LclUtils", name: "CloseOpenTransportPriv" }
    callconv: C
    executor: close_priv

