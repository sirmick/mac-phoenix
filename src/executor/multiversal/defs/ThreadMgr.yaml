# MacPhoenix: the Thread Manager (System 7.5's built-in one), from
# Universal Interfaces' Threads.h. Implemented in C++ (process.cpp,
# "Thread Manager"): each thread runs on a host thread of its own, like
# the processes, so a thread can yield from anywhere, even from inside a
# callback that C++ Toolbox code made. docs/executor/PLAN.md (M3d).

- dispatcher:
    name: ThreadDispatch
    trap: 0xABF2
    selector-location: D0<0xFF>
    comment: |
      D0's low byte selects, its high byte is the parameter size in words
      (THREEWORDINLINE(0x303C, sel, 0xABF2)).

# ####

- enum:
    values:
      - name: kReadyThreadState
        value: 0
      - name: kStoppedThreadState
        value: 1
      - name: kRunningThreadState
        value: 2

- enum:
    values:
      - name: kCooperativeThread
        value: 1
      - name: kPreemptiveThread
        value: 2

- enum:
    values:
      - name: kNoThreadID
        value: 0
      - name: kCurrentThreadID
        value: 1
      - name: kApplicationThreadID
        value: 2

- enum:
    values:
      - name: kNewSuspend
        value: 1
      - name: kUsePremadeThread
        value: 2
      - name: kCreateIfNeeded
        value: 4
      - name: kFPUNotNeeded
        value: 8
      - name: kExactMatchThread
        value: 16

- enum:
    values:
      - name: threadTooManyReqsErr
        value: -617
      - name: threadNotFoundErr
        value: -618
      - name: threadProtocolErr
        value: -619

# ####

- function:
    name: CreateThreadPool
    return: OSErr
    args:
      - name: threadStyle
        type: LONGINT
      - name: numToCreate
        type: INTEGER
      - name: stackSize
        type: LONGINT
    dispatcher: ThreadDispatch
    selector: 0x0501
    executor: C_

- function:
    name: GetFreeThreadCount
    return: OSErr
    args:
      - name: threadStyle
        type: LONGINT
      - name: freeCount
        type: INTEGER*
    dispatcher: ThreadDispatch
    selector: 0x0402
    executor: C_

- function:
    name: NewThread
    return: OSErr
    args:
      - name: threadStyle
        type: LONGINT
      - name: threadEntry
        type: ProcPtr
      - name: threadParam
        type: LONGINT
      - name: stackSize
        type: LONGINT
      - name: options
        type: LONGINT
      - name: threadResult
        type: LONGINT*
      - name: threadMade
        type: LONGINT*
    dispatcher: ThreadDispatch
    selector: 0x0E03
    executor: C_

- function:
