    selector: 0x0504
    executor: C_

- function:
    name: YieldToThread
    return: OSErr
    args:
      - name: suggestedThread
        type: LONGINT
    dispatcher: ThreadDispatch
    selector: 0x0205
    executor: C_
    comment: YieldToAnyThread is YieldToThread(kNoThreadID).

- function:
