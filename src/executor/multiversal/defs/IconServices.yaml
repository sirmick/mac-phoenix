# MacPhoenix: Icon Services (Mac OS 8.5; Universal Interfaces' Icons.h,
# docs/executor/IconServices.md): icons by reference (IconRef), registered
# by creator and type, for files, folders and volumes, drawn and hit-tested
# through Icon Utilities' icon suites. On a Mac it is the System's native
# code behind _IconServicesDispatch ($AA75), PowerPC code reaching it
# through IconServicesLib's glue; Executor implements it in C++
# (iconservices.cpp) and exports IconServicesLib's routines.

- dispatcher:
    name: IconServicesDispatch
    trap: 0xAA75
    selector-location: D0<0xFF>
    comment: |
      The selector in D0 (TWOWORDINLINE(0x70nn, 0xAA75): moveq #nn, D0),
      Pascal arguments on the stack.

# ####

- struct:
    name: OpaqueIconRef

- typedef:
    name: IconRef
    type: OpaqueIconRef*

- typedef:
    name: IconServicesUsageFlags
    type: uint32_t

# ####

# 'icns' (kIconFamilyType): the type, the whole size, then elements, each
# a type, its size (header included) and data.
- struct:
    name: IconFamilyElement
    members:
      - name: elementType
        type: OSType
      - name: elementSize
        type: LONGINT
      - name: elementData
        type: uint8_t[1]

- struct:
    name: IconFamilyResource
    members:
      - name: resourceType
        type: OSType
      - name: resourceSize
        type: LONGINT
      - name: elements
        type: IconFamilyElement[1]

- typedef:
    name: IconFamilyPtr
    type: IconFamilyResource*

- typedef:
    name: IconFamilyHandle
    type: IconFamilyPtr*

