- dispatcher:
    name: MenuDispatch
    trap: 0xA825
    selector-location: D0<0xFF>
    comment: |
      7.5.5's dispatcher (through lowmem $7B0) covers selectors -6..1 and
      only D0's low byte selects; D0's high byte is the parameter size.
      -4..-1 are MBDF message 14, menu title rectangles.

