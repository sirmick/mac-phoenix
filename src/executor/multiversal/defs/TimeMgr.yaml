- only-for: Executor
  struct:
    name: TMTask
    members:
      - name: qLink
        type: QElemPtr
      - name: qType
        type: INTEGER
      - name: tmAddr
        type: ProcPtr
      - name: tmCount
        type: LONGINT
      - name: tmWakeUp
        type: LONGINT
      - name: tmReserved
        type: LONGINT
        comment: |
          I don't trust IMIV-301
    size: 22

# Apple's: tmAddr a TimerUPP (Executor's code keeps a ProcPtr).
- not-for: Executor
  struct:
    name: TMTask

# ####

- typedef:
    name: TMTaskPtr
    type: TMTask*

# ####

- funptr:
    name: TimerProcPtr
    args:
      - name: tmTaskPtr
        type: TMTaskPtr
        register: A1
    comment: |
      A task's routine (tmAddr): on 68k it finds its task in A1; PowerPC
      code gets it as its argument, through a routine descriptor
      (NewTimerUPP). For Executor tmAddr stays a ProcPtr.

# ####

- not-for: Executor
  struct:
    name: TMTask
    members:
      - name: qLink
        type: QElemPtr
      - name: qType
        type: INTEGER
      - name: tmAddr
        type: TimerUPP
      - name: tmCount
        type: LONGINT
      - name: tmWakeUp
        type: LONGINT
      - name: tmReserved
        type: LONGINT
    size: 22

# ####

- function:
    name: InsTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
    executor: true
    trap: 0xA058
    executor_extras: ClearD0

# ####

- function:
    name: InsXTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
    trap: 0xA458

# ####

- function:
    name: RmvTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
    executor: true
    trap: 0xA059
    executor_extras: ClearD0

# ####

- function:
    name: PrimeTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
      - name: count
        type: LONGINT
        register: D0
    executor: true
    trap: 0xA05A
    executor_extras: ClearD0
