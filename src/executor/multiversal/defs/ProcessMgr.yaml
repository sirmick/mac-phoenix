# ####

# MacPhoenix: private OSDispatch selectors Finder 7.5.5 calls, identified
# from a traced real boot and Apple's Process Manager (System 'scod'
# -16463; tools/macdecode). Names are our guesses (learned.yaml).

- function:
    name: TakeDesktopLayer
    return: OSErr
    args:
      - name: layer
        type: GUEST<WindowPtr>*
    dispatcher: OSDispatch
    selector: 0x0014
    executor: C_
    comment: >
      The first caller (Finder) takes the Process Manager's desk layer: a
      window-shaped port whose visRgn is the desktop (GrayRgn), and gets
      protocolErr after that. Finder adopts its regions for its desktop
      window and SysErrors(41) unless this returns noErr.

# ####

- function:
    name: AddProcessCallback
    return: OSErr
    args:
      - name: proc
        type: Ptr
      - name: refCon
        type: int32_t
    dispatcher: OSDispatch
    selector: 0x0042
    executor: C_
    comment: >
      Apple's links {next, proc, refCon, current PSN} into a Process Manager
      list (PM globals -$136); Finder registers one of its routines.

# ####

- function:
    name: GetTempMemInfo
    return: OSErr
    args:
      - name: freeBytes
        type: GUEST<int32_t>*
      - name: maxBlock
        type: GUEST<int32_t>*
    dispatcher: OSDispatch
    selector: 0x0047
    executor: C_
    comment: >
      Either pointer may be nil. Apple's fills them from HeapDispatch $19 and
      $18 (Process Manager heap); which one is the total free and which the
      largest block is our best reading. Finder checks memory with it.

# ####

- function:
    name: SetProcessDragHooks
    return: OSErr
    args:
      - name: hooks
        type: int32_t
    dispatcher: OSDispatch
    selector: 0x0055
    executor: C_
    comment: >
      Stores a long in the current process's record (+$15C in Apple's);
      Finder passes its drag-hook record (see DragDispatch $C301).

# ####

- function:
    name: FindInputWindow
    return: INTEGER
    args:
      - name: pt
        type: Point
      - name: window
        type: WindowPtr*
    dispatcher: OSDispatch
    selector: 0x0064
    executor: C_
    comment: |
      MacPhoenix (name is a guess): 7.5.5's OSDispatch $64, the window
      under a point among the Text Services Manager's floating input
      windows (TextServicesDispatch 23 when the TSM is present, else 0).
      Apple's Help Manager asks before it shows a window's balloon. None
      here (textservices.cpp).

# ####

- function:
    name: SetHideDesktopInBackground
    return: OSErr
    args:
      - name: hide
        type: Boolean
    dispatcher: OSDispatch
    selector: 0x005E
    executor: C_
    comment: >
      General Controls' driver passes its "Show Desktop when in background"
      setting, inverted (name is a guess; learned.yaml).  Apple's stores the
      byte in its globals and, when it turns on while another process is in
      front, hides the desk owner's layer.  Executor only keeps the flag.

# ####

- function:
    name: AddAppleMenuItem
    return: OSErr
    args:
      - name: name
        type: StringPtr
      - name: sortGroup
        type: int16_t
      - name: flagA
        type: int16_t
      - name: iconSuite
        type: Handle
      - name: flagB
        type: int16_t
      - name: info
        type: StringPtr
      - name: key
        type: int32_t
    dispatcher: OSDispatch
    selector: 0x0031
    executor: C_
    comment: >
      Finder feeds the Apple Menu Items folder to the Process Manager, which
      draws the Apple menu (22 bytes of params; System 'scod' -16463 +3020).
      name must be non-empty and key nonzero, else paramErr. The entry keeps
      the name behind two placeholder bytes (the icon's room), the suite,
      the key, sortGroup (passed to the sort comparison), the low bytes of
      flagA/flagB and a copy of info. Names other than name, iconSuite and
      key are guesses.

# ####

- function:
    name: RemoveAppleMenuItems
    return: OSErr
    args:
      - name: key
        type: int32_t
    dispatcher: OSDispatch
    selector: 0x0032
    executor: C_
    comment: >
      Removes the caller's items with that key (0: all of them).

