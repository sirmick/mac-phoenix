# The Component Manager (_ComponentDispatch, $A82A; Inside Macintosh: More
# Macintosh Toolbox ch. 6). Executor's routines are romlib/component.cpp;
# CallComponent (selector 0) and CallComponentFunction (-1), which reshape
# the caller's stack, are raw handlers there on the same dispatcher.

- struct:
    name: ComponentRecord
    members:
      - name: data
        type: LONGINT[1]
    size: 4

# ####

- typedef:
    name: Component
    type: ComponentRecord*

# ####

- struct:
    name: ComponentInstanceRecord
    members:
      - name: data
        type: LONGINT[1]
    size: 4

# ####

- typedef:
    name: ComponentInstance
    type: ComponentInstanceRecord*

# ####

- typedef:
    name: ComponentResult
    type: LONGINT

# ####

- struct:
    name: ComponentDescription
    members:
      - name: componentType
        type: OSType
      - name: componentSubType
        type: OSType
      - name: componentManufacturer
        type: OSType
      - name: componentFlags
        type: uint32_t
      - name: componentFlagsMask
        type: uint32_t
    size: 20

# ####

- struct:
    name: ResourceSpec
    members:
      - name: resType
        type: OSType
      - name: resID
        type: INTEGER
    size: 6

# ####

- struct:
    name: ComponentResource
    members:
      - name: cd
        type: ComponentDescription
      - name: component
        type: ResourceSpec
      - name: componentName
        type: ResourceSpec
      - name: componentInfo
        type: ResourceSpec
      - name: componentIcon
        type: ResourceSpec
    size: 44

# ####

- typedef:
    name: ComponentResourcePtr
    type: ComponentResource*

# ####

- typedef:
    name: ComponentResourceHandle
    type: ComponentResourcePtr*

# ####

- struct:
    name: ComponentParameters
    members:
      - name: flags
        type: uint8_t
      - name: paramSize
        type: uint8_t
      - name: what
        type: INTEGER
      - name: params
        type: LONGINT[1]
    size: 8

# ####

- funptr:
    name: ComponentRoutineUPP
    return: ComponentResult
    args:
      - name: cp
        type: ComponentParameters*
      - name: componentStorage
        type: Handle

# ####

- enum:
    values:
      - name: kAnyComponentType
        value: 0
      - name: kAnyComponentSubType
        value: 0
      - name: kAnyComponentManufacturer
        value: 0
      - name: kAnyComponentFlagsMask
        value: 0
      - name: cmpWantsRegisterMessage
        value: 0x80000000
      - name: registerComponentGlobal
        value: 1
      - name: registerComponentNoDuplicates
        value: 2
      - name: registerComponentAfterExisting
        value: 4
      - name: componentDoAutoVersion
        value: 1
      - name: componentWantsUnregister
        value: 2
      - name: componentAutoVersionIncludeFlags
        value: 4
      - name: componentHasMultiplePlatforms
        value: 8
      - name: defaultComponentIdentical
        value: 0
      - name: defaultComponentAnyFlags
        value: 1
      - name: defaultComponentAnyManufacturer
        value: 2
      - name: defaultComponentAnySubType
        value: 4

# ####

- enum:
    values:
      - name: kComponentOpenSelect
        value: -1
      - name: kComponentCloseSelect
        value: -2
      - name: kComponentCanDoSelect
        value: -3
      - name: kComponentVersionSelect
        value: -4
      - name: kComponentRegisterSelect
        value: -5
      - name: kComponentTargetSelect
        value: -6
      - name: kComponentUnregisterSelect
        value: -7

# ####

- enum:
    values:
      - name: invalidComponentID
        value: -3000
      - name: validInstancesExist
        value: -3001
      - name: componentNotCaptured
        value: -3002
      - name: componentDontRegister
        value: -3003
      - name: unresolvedComponentDLLErr
        value: -3004

# ####

- enum:
    values:
      - name: badComponentInstance
        value: 0x80008001
      - name: badComponentSelector
        value: 0x80008002

# ####

- dispatcher:
    name: ComponentDispatch
    trap: 0xA82A
    selector-location: D0W

# ####

- function:
    name: RegisterComponent
    return: Component
    args:
      - name: cd
        type: ComponentDescription*
      - name: componentEntryPoint
        type: ComponentRoutineUPP
      - name: global
        type: INTEGER
      - name: componentName
        type: Handle
      - name: componentInfo
        type: Handle
      - name: componentIcon
        type: Handle
    dispatcher: ComponentDispatch
    selector: 0x01
    executor: C_

# ####

- function:
    name: UnregisterComponent
    return: OSErr
    args:
      - name: aComponent
        type: Component
    dispatcher: ComponentDispatch
    selector: 0x02
    executor: C_

# ####

- function:
