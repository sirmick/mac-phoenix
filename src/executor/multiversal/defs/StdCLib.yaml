# StdCLib: the C library a Power Mac has in ROM, as Executor answers it
# (romlib/clib/stdclib.cpp, stdio.cpp; docs/executor/PPCLibs.md). Only for
# Executor: a guest program's own C headers declare these (Retro68's newlib,
# MPW's CIncludes). Types are the implementations' (uint32_t for size_t and
# for pointers the routine reads itself). Data exports (errno, _iob, ...)
# are registered by stdclib.cpp; raw routines decode their own arguments.

# ---- stdclib.cpp -------------------------------------------------

- only-for: Executor
  function:
    name: "memcpy"
    return: "char*"
    args:
      - name: "d"
        type: "char*"
      - name: "s"
        type: "const char*"
      - name: "n"
        type: "uint32_t"
    library: StdCLib
    executor: c_memcpy

- only-for: Executor
