- enum:
    values:
      - name: nmType
        value: 8
      - name: nmTypErr
        value: -299

# ####

- only-for: Executor
  struct:
    name: NMRec
    members:
      - name: qLink
        type: QElemPtr
      - name: qType
        type: INTEGER
      - name: nmFlags
        type: INTEGER
      - name: nmPrivate
        type: LONGINT
      - name: nmReserved
        type: INTEGER
      - name: nmMark
        type: INTEGER
      - name: nmIcon
        type: Handle
      - name: nmSound
        type: Handle
      - name: nmStr
        type: StringPtr
      - name: nmResp
        type: ProcPtr
        comment: |
          void myresponse(NMRecPtr foo)
      - name: nmRefCon
        type: LONGINT
    size: 36

# Apple's: nmResp an NMUPP (Executor's code keeps a ProcPtr).
- not-for: Executor
  struct:
    name: NMRec

# ####

- typedef:
    name: NMRecPtr
    type: NMRec*
    comment: |
      value of -1 means remove queue element
                                 automatically

# ####

- funptr:
    name: NMProcPtr
    args:
      - name: nmReqPtr
        type: NMRecPtr

# ####

- not-for: Executor
  struct:
    name: NMRec
    members:
      - name: qLink
        type: QElemPtr
      - name: qType
        type: INTEGER
      - name: nmFlags
        type: INTEGER
      - name: nmPrivate
        type: LONGINT
      - name: nmReserved
        type: INTEGER
      - name: nmMark
        type: INTEGER
      - name: nmIcon
        type: Handle
      - name: nmSound
        type: Handle
      - name: nmStr
        type: StringPtr
      - name: nmResp
        type: NMUPP
      - name: nmRefCon
        type: LONGINT
    size: 36

# ####

- function:
    name: NMInstall
    return: OSErr
    args:
      - name: nmptr
        type: NMRecPtr
        register: A0
    executor: true
    trap: 0xA05E
    returnreg: D0

# ####

- function:
    name: NMRemove
    return: OSErr
    args:
      - name: nmptr
        type: NMRecPtr
        register: A0
    executor: true
    trap: 0xA05F
    returnreg: D0
