# NameRegistry.yaml — Name Registry interface definitions
#
# The Name Registry is the PowerPC Mac OS database of devices, built from
# the Open Firmware device tree at startup.  Native drivers use it to find
# their own device node and read its properties ("reg", "assigned-addresses",
# "driver-ist" and so on).  PowerPC only: the routines are exported by
# NameRegistryLib.
#
# Written from Designing PCI Cards and Drivers for Power Macintosh Computers
# (Apple, 1995-1999), chapter 10, "Name Registry".  No Apple header text is
# reproduced.  This covers the entry ID, iteration, search, paths and
# property access; the modifier routines are not declared yet.  Executor's
# NameRegistryLib (nameregistry.cpp) is a registry with the root and its
# "Devices" entry only; the answers, errors included, as a G3's on 8.6
# (a probe through CFM, 2026-11-03).
#
# Natural (PowerPC) alignment through `align: power`, like DriverServices.yaml,
# and for the same reason: RegEntryID is embedded in drivers' own structures.

- struct:
    name: RegEntryID
    align: power
    members:
      - name: contents
        type: UInt32[4]
    size: 16
    comment: |
      Identifies one entry in the Name Registry.  Opaque: copy the whole
      structure, and dispose of IDs the Registry hands out with
      RegistryEntryIDDispose.

# ####

- typedef:
    name: RegEntryIDPtr
    type: RegEntryID*

# ####

- typedef:
    name: RegPropertyName
    type: char
    comment: |
      Property names are C strings.

# ####

- typedef:
    name: RegPropertyNamePtr
    type: RegPropertyName*

# ####

- typedef:
    name: RegPropertyValueSize
    type: UInt32

# ####

- struct:
    name: RegEntryIter
    align: power
    members:
      - name: opaque
        type: void*
    size: 4

# ####

- typedef:
    name: RegEntryIterPtr
    type: RegEntryIter*

# ####

- typedef:
    name: RegIterationOp
    type: UInt32

# ####

- typedef:
    name: RegEntryIterationOp
    type: RegIterationOp

# ####

- enum:
    values:
      - name: kRegIterContinue
        value: 0x1
        comment: keep going in the same direction
      - name: kRegIterRoot
        value: 0x2
      - name: kRegIterParents
        value: 0x3
      - name: kRegIterChildren
        value: 0x4
      - name: kRegIterDescendants
        value: 0x5
        comment: the whole subtree; a new iterator starts here, at the root
      - name: kRegIterSibling
        value: 0x6

# ####

- typedef:
    name: RegPathNameSize
    type: UInt32

# ####

- typedef:
    name: RegCStrPathName
    type: char

# ####

- typedef:
    name: RegPropertyIter
    type: void*

# ####

- enum:
    values:
      - name: nrInvalidNodeErr
        value: -2538
        comment: not an entry (an ID from RegistryEntryIDInit, one disposed of)
      - name: nrNotFoundErr
        value: -2539
        comment: no such property
      - name: nrDataTruncatedErr
        value: -2543
      - name: nrPathNotFound
        value: -2550
      - name: nrPathBufferTooSmall
        value: -2551

# ####

- function:
    name: RegistryEntryIDInit
    return: OSStatus
    args:
      - name: id
        type: RegEntryID*
    library: NameRegistryLib
    executor: C_
    comment: |
      Not an entry yet: compares equal to another such ID.

# ####

- function:
    name: RegistryEntryIDCompare
    return: Boolean
    args:
      - name: id1
        type: const RegEntryID*
      - name: id2
        type: const RegEntryID*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryEntryIDCopy
    return: OSStatus
    args:
      - name: src
        type: const RegEntryID*
      - name: dst
        type: RegEntryID*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryEntryIDDispose
    return: OSStatus
    args:
      - name: id
        type: RegEntryID*
    library: NameRegistryLib
    executor: C_
    comment: |
      Clears the ID.

# ####

- function:
    name: RegistryEntryIterateCreate
    return: OSStatus
    args:
      - name: cookie
        type: RegEntryIter*
    library: NameRegistryLib
    executor: C_
    comment: |
      An iterator at the root.

# ####

- function:
    name: RegistryEntryIterateDispose
    return: OSStatus
    args:
      - name: cookie
        type: RegEntryIter*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryEntryIterateSet
    return: OSStatus
    args:
      - name: cookie
        type: RegEntryIter*
      - name: startEntryID
        type: const RegEntryID*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryEntryIterate
    return: OSStatus
    args:
      - name: cookie
        type: RegEntryIter*
      - name: relationship
        type: RegEntryIterationOp
      - name: foundEntry
        type: RegEntryID*
      - name: done
        type: Boolean*
    library: NameRegistryLib
    executor: C_
    comment: |
      Each entry returned in foundEntry must be disposed of with
      RegistryEntryIDDispose.  No more entries: done true, noErr.

# ####

- function:
    name: RegistryEntrySearch
    return: OSStatus
    args:
      - name: cookie
        type: RegEntryIter*
      - name: relationship
        type: RegEntryIterationOp
      - name: foundEntry
        type: RegEntryID*
      - name: done
        type: Boolean*
      - name: propertyName
        type: const RegPropertyName*
      - name: propertyValue
        type: const void*
      - name: propertySize
        type: RegPropertyValueSize
    library: NameRegistryLib
    executor: C_
    comment: |
      As RegistryEntryIterate, entries with the property only (and that
      value, when propertyValue isn't nil).

# ####

- function:
    name: RegistryEntryToPathSize
    return: OSStatus
    args:
      - name: entryID
        type: const RegEntryID*
      - name: pathSize
        type: RegPathNameSize*
    library: NameRegistryLib
    executor: C_
    comment: |
      The path's length with its terminating zero.

# ####

- function:
    name: RegistryCStrEntryToPath
    return: OSStatus
    args:
      - name: entryID
        type: const RegEntryID*
      - name: pathName
        type: RegCStrPathName*
      - name: pathSize
        type: RegPathNameSize
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryCStrEntryLookup
    return: OSStatus
    args:
      - name: searchPointID
        type: const RegEntryID*
      - name: pathName
        type: const RegCStrPathName*
      - name: foundEntry
        type: RegEntryID*
    library: NameRegistryLib
    executor: C_
    comment: |
      A path of entry names separated by colons, from searchPointID (nil:
      the root).

# ####

- function:
    name: RegistryPropertyGetSize
    return: OSStatus
    args:
      - name: entryID
        type: const RegEntryID*
      - name: propertyName
        type: const RegPropertyName*
      - name: propertySize
        type: RegPropertyValueSize*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryPropertyGet
    return: OSStatus
    args:
      - name: entryID
        type: const RegEntryID*
      - name: propertyName
        type: const RegPropertyName*
      - name: propertyValue
        type: void*
      - name: propertySize
        type: RegPropertyValueSize*
    library: NameRegistryLib
    executor: C_
    comment: |
      propertySize is the buffer size on entry and the value's size on
      return.

# ####

- function:
    name: RegistryPropertyIterateCreate
    return: OSStatus
    args:
      - name: entry
        type: const RegEntryID*
      - name: cookie
        type: RegPropertyIter*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryPropertyIterateDispose
    return: OSStatus
    args:
      - name: cookie
        type: RegPropertyIter*
    library: NameRegistryLib
    executor: C_

# ####

- function:
    name: RegistryPropertyIterate
    return: OSStatus
    args:
      - name: cookie
        type: RegPropertyIter*
      - name: foundProperty
        type: RegPropertyName*
      - name: done
        type: Boolean*
    library: NameRegistryLib
    executor: C_
    comment: |
      foundProperty: a buffer of 32 bytes (a property name's longest, with
      its zero).

# ####

- function:
    name: RegistryPropertyCreate
    return: OSStatus
    args:
      - name: entryID
        type: const RegEntryID*
      - name: propertyName
        type: const RegPropertyName*
      - name: propertyValue
        type: const void*
      - name: propertySize
        type: RegPropertyValueSize
    comment: |
      Fails if the property already exists; use RegistryPropertySet to
      change the value of an existing one.

# ####

- function:
    name: RegistryPropertySet
    return: OSStatus
    args:
      - name: entryID
        type: const RegEntryID*
      - name: propertyName
        type: const RegPropertyName*
      - name: propertyValue
        type: const void*
      - name: propertySize
        type: RegPropertyValueSize
