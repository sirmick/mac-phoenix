- function:
    name: FSReadFork68K
    comment: |
      68K glue: a Pascal value parameter over 4 bytes (SInt64) comes as a
      pointer to it; PowerPC passes the value (FSReadFork, InterfaceLib only).
    return: OSErr
    args:
      - name: forkRefNum
        type: int16_t
      - name: positionMode
        type: uint16_t
      - name: positionOffset
        type: wide*
      - name: requestCount
        type: ByteCount
      - name: buffer
        type: Ptr
      - name: actualCount
        type: ByteCount*
    dispatcher: HighLevelFSDispatch
    selector: 0x0029
    executor: C_

